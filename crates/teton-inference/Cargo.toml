[package]
name = "teton-inference"
description = "Local inference: llama.cpp embedding, hardware probe, benchmark."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[features]
# NON-DEFAULT. Compiling the real llama.cpp binding (`llama-cpp-2`) builds
# llama.cpp from source and needs cmake. Default builds and CI ship only the
# `Engine` trait and `MockEngine`, so they never compile llama.cpp and never
# require cmake. Enable the real engine with `--features llama`.
llama = ["dep:llama-cpp-2", "dep:encoding_rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"

# Real inference backend — optional, gated behind the `llama` feature above.
llama-cpp-2 = { version = "0.1.151", optional = true }
# Stateful UTF-8 decoding for streamed token pieces — a single BPE token can end
# mid-way through a multi-byte character, so the decoder must outlive the whole
# stream (`PieceDecoder` in engine.rs, which decodes the raw piece bytes itself
# rather than through llama-cpp-2's under-reserving wrapper). Same version
# llama-cpp-2 itself depends on.
encoding_rs = { version = "0.8.35", optional = true }

[target.'cfg(unix)'.dependencies]
# Only for `O_NOFOLLOW` on the partial-download open (REQ-547 M-11): refuse to
# write through a symlink planted at the predictable `.part` path.
libc = "0.2"

[lints]
workspace = true
