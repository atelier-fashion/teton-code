[package]
name = "teton-core"
description = "Router, session state, and cost ledger — pure logic, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# teton-core is the privacy/logic core: NO I/O dependencies (no tokio, no
# reqwest, no async runtime). Only pure-logic crates are allowed here so the
# routing and privacy-boundary logic stays trivially testable and cannot itself
# perform egress.
# REQ-571 TASK-122. `test-seam` exposes `ProvenanceId::unvalidated_for_test`,
# the only way to build the malformed id ADR-D's redundant egress guard exists
# to catch — the guard is unreachable by construction, which is precisely why it
# needs its own test (LESSON-508). Off in every shipped build: `tetond` turns it
# on through a dev-dependency, so production code reaching for the seam fails to
# compile rather than relying on a review catch.
[features]
test-seam = []

[dependencies]
# The wire vocabulary this crate's lifetime decision is expressed in
# (REQ-565). teton-protocol is a pure leaf — serde/serde_json/thiserror only —
# so it carries no I/O and the rule above still holds. The edge points this way
# because the protocol types are shared by daemon *and* clients, while this
# crate is daemon-side domain logic; teton-protocol must never depend back.
teton-protocol = { path = "../teton-protocol" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# REQ-574: format-preserving TOML editing, so a config write changes the keys
# its operation is about and leaves the user's comments, key order and unknown
# keys byte-for-byte alone (BR-1). This is a *parsing* library, not I/O — the
# no-I/O rule above still holds — and `toml 0.8` above is itself built on it, so
# the lockfile already carries toml_edit 0.22.27 and the tree gains no new code.
toml_edit = "0.22"
thiserror = "2"
globset = "0.4"

[dev-dependencies]
# Test-only. The REQ-559 effort ladder has a hand-written Serialize/Deserialize
# pair (a bitset that must present as a level list), and that is exactly where
# silent drift lives — so both directions are pinned against JSON literals.
# A dev-dependency, so the no-I/O rule above is untouched for the shipped crate.
serde_json = "1"

[lints]
workspace = true
