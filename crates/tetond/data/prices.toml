# Teton Code provider price table.
#
# Versioned *data*, not code (mirrors `teton-inference/data/models.toml`): the
# daemon can drop in a newer table — bumping `version` — without a `tetond`
# release. Each entry gives one MODEL its per-million-token price, expressed in
# integer micro-USD so money never rounds through a float.
#
# LOOKUP IS KEYED ON `model` ALONE (REQ-557 ADR-A). `provider_id` is a label —
# it names the vendor an entry was authored against and renders the baseline as
# `provider/model` — but it is NOT part of the key. Two providers calling the
# same model share one row, which is the point: it is what lets one vendor serve
# two models and one model be served by two endpoints.
#
# Consequences when editing this file:
#   - Do NOT add a second row for a model that already has one to give a
#     particular provider a different rate. Lookup takes the first match, so the
#     new row would be dead and its calls billed at the existing rate.
#   - Do NOT price anything at zero. A zero row applies to every provider
#     declaring that model, including a paid gateway, which would then be
#     reported as free AND credited with the full baseline as savings (BUG-155).
#     Both rules are enforced by tests in `src/cost/prices.rs`.
#   - A row keyed on a RETIRED vendor id does not error — the calls it used to
#     price silently become unpriced, so the meter under-reports and nobody
#     sees it. That is why every remote recipe's example model must have a row
#     here: `the_price_table_and_the_recipe_catalogs_example_models_agree`
#     (tests/web_setup_contracts.rs) goes red when the catalog and this table
#     drift apart. Fix a red gate by re-verifying the vendor's pricing page and
#     editing THIS file, never by editing the catalog.
#
#   input_usd_micros_per_mtok  = micro-USD charged per 1,000,000 input tokens
#   output_usd_micros_per_mtok = micro-USD charged per 1,000,000 output tokens
#
# So a $15 / Mtok input rate is 15_000_000 micro-USD. A single call's cost is
#   input_tokens  * input_rate  / 1_000_000
# + output_tokens * output_rate / 1_000_000   (integer micro-USD).
#
# BR-2: a model ABSENT from this table is *unpriced* — the ledger records its
# token counts with a NULL cost and the report surfaces them as "unpriced
# tokens", naming the model so a user can see what needs a price. A price is
# NEVER guessed for an unknown model.
#
# `[baseline]` names the all-frontier comparator used for the AC-4 savings
# estimate (OQ-6): the report reprices every priced call's token volume at this
# model and reports the difference as an *estimate* (never as measured fact).
#
# NOTE: the rates below are public list prices (standard tier: cache-miss
# input, no batch/priority discounts), verified 2026-08-14 against each
# vendor's own pricing page, kept here as data so they can be corrected
# without a code change. Version 1's rows were all keyed on ids their vendors
# have since retired (claude-opus-4 / claude-sonnet-4 / claude-3-5-haiku,
# retired 2026-06-15 and 2026-02-19; deepseek-chat / deepseek-reasoner,
# retired 2026-07-24; kimi-k2, discontinued 2026-05-25) — exactly the silent
# under-reporting the gate above now catches.

version = 2

# The all-frontier baseline for the savings estimate (AC-4 / OQ-6). Must name a
# model that also appears in `[[models]]` below. `claude-fable-5` is the most
# capable generally available frontier model at authoring time — the honest
# "what if every call had gone to the frontier" comparator now that the
# retired claude-opus-4's $15/$75 tier no longer exists to be compared against.
[baseline]
provider_id = "anthropic"
model = "claude-fable-5"

# --- Anthropic ---------------------------------------------------------------
# Verified 2026-08-14 against platform.claude.com/docs/en/about-claude/pricing
# and .../models/overview.

[[models]]
provider_id = "anthropic"
model = "claude-fable-5"
input_usd_micros_per_mtok = 10_000_000
output_usd_micros_per_mtok = 50_000_000

[[models]]
provider_id = "anthropic"
model = "claude-opus-5"
input_usd_micros_per_mtok = 5_000_000
output_usd_micros_per_mtok = 25_000_000

# Sonnet 5's launch pricing was made the standard price on 2026-08 (the
# announced 2026-09-01 increase to $3/$15 was cancelled).
[[models]]
provider_id = "anthropic"
model = "claude-sonnet-5"
input_usd_micros_per_mtok = 2_000_000
output_usd_micros_per_mtok = 10_000_000

[[models]]
provider_id = "anthropic"
model = "claude-haiku-4-5"
input_usd_micros_per_mtok = 1_000_000
output_usd_micros_per_mtok = 5_000_000

# --- OpenAI ------------------------------------------------------------------
# Verified 2026-08-14 against developers.openai.com/api/docs/pricing. The
# `gpt-5.6` alias routes to (and bills as) the `gpt-5.6-sol` snapshot; both
# spellings get a row because lookup keys on the exact string a provider
# declares, and a user may pin the snapshot. Same model, same rate — this is
# two spellings priced once each, not a duplicate row for one key.

[[models]]
provider_id = "openai"
model = "gpt-5.6"
input_usd_micros_per_mtok = 5_000_000
output_usd_micros_per_mtok = 30_000_000

[[models]]
provider_id = "openai"
model = "gpt-5.6-sol"
input_usd_micros_per_mtok = 5_000_000
output_usd_micros_per_mtok = 30_000_000

# --- DeepSeek ----------------------------------------------------------------
# DeepSeek bills by time of day from 2026-08-16 16:00 UTC: peak hours are
# 01:00-04:00 and 06:00-10:00 UTC, every other hour is off-peak at half the
# peak rate (off-peak: v4-pro $0.66/$1.98, v4-flash $0.22/$0.66 per Mtok).
# This table's schema is one flat rate per model, so BY CONVENTION these rows
# carry the PEAK rate: the ceiling can over-state actual spend (up to 2x for
# off-peak calls) but never under-states it, and so never inflates the savings
# estimate — silent under-reporting is the failure mode the version note above
# exists to catch. If the off-peak error ever matters, first-class time-of-day
# rates are a schema change (REQ-sized), not a data edit.
# Announced schedule verified 2026-08-14 against
# api-docs.deepseek.com/quick_start/pricing. Shipped 2026-08-14, ahead of the
# switch, by decision — until it lands these rows overstate DeepSeek spend
# (true flat rates then: v4-pro $0.435/$0.87, v4-flash $0.14/$0.28). Re-verify
# the live page once time-of-day billing is in effect.

[[models]]
provider_id = "deepseek"
model = "deepseek-v4-pro"
input_usd_micros_per_mtok = 1_320_000
output_usd_micros_per_mtok = 3_960_000

[[models]]
provider_id = "deepseek"
model = "deepseek-v4-flash"
input_usd_micros_per_mtok = 440_000
output_usd_micros_per_mtok = 1_320_000

# --- Moonshot (Kimi) ---------------------------------------------------------
# Verified 2026-08-14 against platform.kimi.ai/docs/pricing/chat-k3.

[[models]]
provider_id = "moonshot"
model = "kimi-k3"
input_usd_micros_per_mtok = 3_000_000
output_usd_micros_per_mtok = 15_000_000

# --- xAI (Grok) --------------------------------------------------------------
# Verified 2026-08-14 against docs.x.ai/docs/models. Standard tier (prompts
# under 200k tokens); the >=200k-prompt tier bills all tokens at 2x these
# rates, which this schema cannot express.

[[models]]
provider_id = "xai"
model = "grok-4.6"
input_usd_micros_per_mtok = 2_000_000
output_usd_micros_per_mtok = 6_000_000

# --- Local tier --------------------------------------------------------------
# DELIBERATELY EMPTY (BUG-155).
#
# On-device inference has no marginal API cost, and this table used to carry
# zero-priced rows for the local models to say so. Two facts made those rows
# actively harmful once REQ-557 re-keyed lookup on the model alone:
#
#   1. They were never used for their stated purpose. Local turns are not
#      metered at all — the cost meter is attached to the egress transport
#      (`Egress::with_cost_meter`), which only the REMOTE path constructs, so a
#      local call never reaches a price lookup.
#   2. Keyed on model alone, they matched ANY provider. A self-hosted or rented
#      GPU endpoint declaring `model = "qwen2.5-coder-7b"` — exactly the
#      one-model-many-providers shape BR-3 exists to enable — was billed from
#      the local row: reported as costing $0 AND credited with the full Opus
#      baseline as savings. A metered API call reported as free, with a
#      fabricated saving on top.
#
# With no row, such a call is correctly *unpriced* and named in `teton cost`,
# which is the honest answer: we do not know what that gateway charges. This is
# BR-9 ("never a $0 record for a model we cannot price") holding.
