name: Release

# Pushing `vX.Y.Z` is the whole trigger: the tag is the single source of truth
# for every version-shaped string downstream (BR-3), and the first thing this
# workflow does is prove the tag and the workspace manifest agree.
#
# `workflow_dispatch` exists so the pipeline itself is testable without burning
# a tag. With `dry_run` left at its default the run does everything — gate,
# build all three targets, smoke each artifact, assemble `checksums.txt`, render
# the release notes — and stops one step short of publishing.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run the gate, builds, smokes and checksums, but publish nothing."
        type: boolean
        default: true

# A newer run does NOT cancel an in-flight one — it queues behind it. A release
# is half-published for a few seconds in the middle of `gh release create`;
# cancelling there leaves a release with some of its assets, which is worse than
# waiting.
#
# ci.yml also declines to cancel on a newer push, but by the opposite mechanism
# and for a different reason: it keys its group per commit so distinct commits
# run *concurrently*, reserving cancellation for duplicate runs of one commit
# (REQ-605). Here concurrency is not the goal — the queue is — so this group
# stays coarse and cancel-in-progress stays false.
#
# This group is keyed on the ref, which is right for building and publishing —
# two tags are two independent releases and neither should wait on the other —
# and wrong for the tap, which is one file every run overwrites. The tap-writing
# job therefore carries its own repo-wide group (`tap-bump`) AND refuses a
# version that would move the tap backwards; ordering there is a correctness
# property, not a performance one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

# Least privilege by default. Two jobs widen this, each only to what it needs:
# `release` writes the GitHub Release, `dispatch-site-deploy` starts one
# workflow.
permissions:
  contents: read

jobs:
  preflight:
    name: version gate (BR-3 / ADR-548-4)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.gate.outputs.tag }}
      version: ${{ steps.gate.outputs.version }}
      publish: ${{ steps.gate.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Nothing is built until the tag is a version shape this pipeline supports
      # and the tag and `[workspace.package] version` agree. The exit code is a
      # taxonomy, not a boolean, so "the versions disagree" can never be
      # confused with "the check could not run" (LESSON-442):
      #
      #   0   MATCH       proceed.
      #   64  REFUSED     red, ::error::. The gate RAN and rejected the tag —
      #                   either it is not a plain `vX.Y.Z`, or it names a
      #                   version the workspace does not declare. Retag, or bump
      #                   the manifest. Nothing was built.
      #   *   UNCHECKED   red, ::error::. The gate could not run at all (missing
      #                   manifest, unparseable version). This is NOT evidence
      #                   that the versions agree, so the release stops here
      #                   rather than shipping on an unverified version.
      - name: Tag vs workspace version
        id: gate
        env:
          # A `workflow_dispatch` boolean arrives as the string "true"/"false";
          # on a tag push the whole `inputs` context is absent and this is "".
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            # Dispatched from a branch: there is no tag, so the version comes
            # from the manifest and the comparison below is the manifest against
            # itself — it cannot fail, and it is not pretending to be the gate.
            # The gate is the tag push. This path exists so the rest of the
            # pipeline (build, smoke, checksums) is exercisable on demand.
            manifest_version="$(bash tools/release/verify-version.sh --print-version)" || {
              echo "::error title=Version gate UNCHECKED::The workspace version could not be read from Cargo.toml, so this run has no version to build. See the log."
              exit 75
            }
            tag="v$manifest_version"
            echo "::notice title=No tag to gate::This run was dispatched from '$GITHUB_REF_NAME', which is not a tag, so the version was taken from Cargo.toml ($tag) and the version gate compares it against itself. The real BR-3 gate runs on the tag push."
          fi

          # BR-3 names exactly one version shape, `vX.Y.Z`, and everything
          # downstream assumes it: the tarball filenames, the version Homebrew
          # scans back out of the formula's URLs, `brew audit`, the site's
          # install line. `v0.1.0-rc.1` and `v0.1.0+build.5` both match this
          # workflow's `v*.*.*` trigger and neither survives those assumptions —
          # a prerelease would be published as an ordinary release and pushed to
          # the tap as the version every `brew install` hands out, and build
          # metadata breaks every filename reconstructed from the version. So
          # both are refused HERE, before anything is built.
          #
          # The trigger glob is deliberately not narrowed to exclude them
          # (`tags: ["v*.*.*", "!v*-*", "!v*+*"]` would work): a refused tag has
          # to be a red run with a reason on it. A tag push that silently does
          # nothing is indistinguishable from a broken workflow.
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Unsupported version shape (BR-3)::Tag '$tag' resolves to version '$version', which is not a plain X.Y.Z. Prerelease ('-rc.1') and build-metadata ('+build.5') versions are NOT supported by this pipeline: they would be published as an ordinary release and pushed to the tap as the version every user installs. Nothing was built. Retag as vX.Y.Z."
            exit 64
          fi

          # The runner's default shell is `bash -e`, so the check is bracketed
          # by `set +e`/`set -e` — otherwise a failing gate would abort the step
          # before its annotation could name which failure it was.
          set +e
          bash tools/release/verify-version.sh "$tag"
          status=$?
          set -e

          case "$status" in
            0)
              echo "::notice title=Version gate MATCH::Tag $tag matches the workspace version. Building all three targets."
              ;;
            64)
              echo "::error title=Version MISMATCH (BR-3)::Tag $tag and the root Cargo.toml [workspace.package] version name different versions — see the log for both. Nothing was built. Bump the workspace version or retag."
              exit "$status"
              ;;
            *)
              echo "::error title=Version gate UNCHECKED::verify-version.sh could not perform the check (exit $status). Nothing was learned about the tag, so the release is stopped rather than built on an unverified version."
              exit "$status"
              ;;
          esac

          # Publish only from a real tag ref, and only when a dry run was not
          # requested. A branch dispatch never publishes: `gh release create`
          # would mint a tag as a side effect, which is exactly the
          # "a release appeared from nowhere" outcome the tag gate exists to
          # prevent.
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "${DRY_RUN:-}" != "true" ]; then
            publish=true
          else
            publish=false
          fi

          # `version` was validated against the strict shape above, so nothing
          # downstream — including the run bodies that interpolate it — can be
          # handed anything but digits and dots.
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

  build:
    name: build · smoke (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    # REQ-550 ADR-550-2: the signing secrets resolve only under the
    # release-signing environment, whose deployment-branch-and-tag rules admit
    # exactly two shapes of ref — the `main` BRANCH and `v*.*.*` TAGS. Both are
    # deliberate. The tag rule is what guards a real release. The `main` rule is
    # what lets a `workflow_dispatch` dry run from `main` start at all: without
    # it the whole signing path would be unexercisable without burning a tag,
    # which is the opposite of what the dry-run mode exists for. A dry run from
    # `main` therefore DOES reach the certificate — it signs, smokes and attests
    # real bytes and then publishes none of them. Any other ref (a feature
    # branch, a fork's ref) is admitted by neither rule and cannot reach the
    # certificate at all.
    #
    # Declared on the whole matrix job rather than per-leg, because a
    # conditional `environment:` is not expressible in this schema. The Linux
    # leg carries the declaration harmlessly — it never reads either secret —
    # and the environment's own rules are what decide whether this job can reach
    # the certificate.
    environment: release-signing
    strategy:
      # One target failing should not hide the state of the other two — a
      # release needs to know everything that is broken, not the first thing.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            rosetta: false
          # GitHub retired Intel macOS runners, so this leg is cross-compiled on
          # the arm64 runner and smoke-tested under Rosetta 2 (ADR-548-2). That
          # proves the binary loads and runs; it is not native-hardware
          # evidence, and the release notes say so at exactly that strength.
          - target: x86_64-apple-darwin
            os: macos-15
            rosetta: true
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            rosetta: false
    steps:
      # SHA-pinned: this job holds MACOS_CERT_P12 and MACOS_CERT_PASSWORD from
      # the release-signing environment, and a checkout runs first and runs as
      # the job — a moved tag would execute new code with the Developer ID
      # private key reachable. See the carve-out note below.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pinned Rust toolchain
        # rustup reads rust-toolchain.toml and installs the pinned channel.
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add "$TARGET"

      # Third-party actions are pinned to a full commit SHA. A tag is a mutable
      # pointer someone else controls, and this job produces the bytes users
      # install — `@v2` moving under us is a supply-chain change nobody in this
      # repository would see in a diff. First-party `actions/*` mostly stay on
      # their major tag, matching ci.yml: GitHub owns the runner those actions
      # execute on, so pinning them defends against a strictly smaller threat
      # than the upgrade friction costs.
      #
      # That carve-out has two named exceptions, and both are about what the
      # step can REACH rather than who wrote it:
      #
      #   * actions/attest-build-provenance, in the `release` job, is pinned
      #     because it mints signed claims about our artifacts.
      #   * actions/checkout, actions/upload-artifact and
      #     actions/download-artifact are pinned by SHA in every
      #     CREDENTIAL-BEARING job — `build` (THIS job: it declares
      #     `environment: release-signing` and holds MACOS_CERT_P12 and
      #     MACOS_CERT_PASSWORD, the Developer ID private key this pipeline
      #     signs with), `release` (contents/id-token/attestations: write),
      #     `bump-formula` (holds HOMEBREW_TAP_TOKEN) and `verify-install`
      #     (attestations: read, and it runs the provenance gate). A checkout
      #     runs first and runs as the job, so in those a moved tag would
      #     execute new code alongside the signing certificate, the
      #     release-write token, the tap's push credential, or the OIDC
      #     identity this workflow's provenance is signed with. The artifact
      #     actions are the same argument by a different door: they run inside
      #     those jobs and they touch the very bytes being published.
      #
      # ONLY `preflight` keeps `@v4`. It holds no secret and no write
      # permission — it reads a ref and computes strings — so pinning it buys
      # nothing. This job used to be listed beside it as "holds nothing"; that
      # was wrong the moment it gained `environment: release-signing`, and the
      # claim is corrected here rather than left to be re-derived. The line is
      # drawn where the credentials are, and the credentials are here.
      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          # Each target compiles its own llama.cpp; sharing one cache key across
          # them would thrash it every run.
          key: release-${{ matrix.target }}
          # A release binary must not be assembled out of cache entries some
          # other run wrote. `save-if: false` stops this job writing any, and
          # rust-cache's restore key carries the `release-<target>` prefix
          # above, which nothing else in this repository writes — so the restore
          # misses and a tag build compiles cold. That is the intent, not a side
          # effect: the cost is build minutes on a tag push, which is the
          # cheapest place in this pipeline to spend them.
          save-if: false

      # llama.cpp is built by its own cmake, which does not read Rust's
      # `--target`. Without this it would happily produce arm64 objects for an
      # x86_64 Rust build and fail at link — in this job, which is the loud
      # place for it to fail, but with a message that reads like a linker bug
      # rather than a configuration one.
      - name: Point llama.cpp's cmake at the cross target
        if: matrix.rosetta
        run: echo "CMAKE_OSX_ARCHITECTURES=x86_64" >>"$GITHUB_ENV"

      # Rosetta 2 is NOT preinstalled on GitHub's arm64 macOS runner images, so
      # the probe below on its own failed the x86_64 leg of every tag, forever.
      # The install is idempotent and takes seconds. This step deliberately
      # asserts nothing: if it cannot install Rosetta, the probe that follows is
      # still what decides, and it says so out loud.
      - name: Install Rosetta 2 (x86_64 smoke host)
        if: matrix.rosetta
        run: |
          if sudo softwareupdate --install-rosetta --agree-to-license; then
            echo "::notice title=Rosetta 2 install requested::softwareupdate reported success. It is a no-op when Rosetta is already present."
          else
            echo "::warning title=Rosetta 2 install did not report success::'softwareupdate --install-rosetta --agree-to-license' exited non-zero. That is not by itself evidence that Rosetta is unavailable — the probe in the next step is the assertion."
          fi

      # Checked before the build so a runner without Rosetta costs a minute
      # rather than a full llama.cpp compile, and so the failure names its own
      # cause instead of surfacing as an exec-format error inside the smoke.
      - name: Verify Rosetta 2 is available (x86_64 smoke host)
        if: matrix.rosetta
        run: |
          if arch -x86_64 /usr/bin/true >/dev/null 2>&1; then
            echo "::notice title=Rosetta 2 available::The x86_64 artifact will be smoke-tested under Rosetta 2 on this arm64 runner (ADR-548-2)."
          else
            echo "::error title=Rosetta 2 unavailable::This runner cannot execute x86_64 binaries even after the install step above, so the x86_64-apple-darwin artifact could NOT be exercised. Failing rather than shipping an unsmoked binary for a platform we cannot test here."
            exit 75
          fi

      # THE SPLIT (ADR-551-1), and the ORDER of the steps below is the whole of
      # REQ-551. What was a single "Build and package" step on a macOS leg is
      # now three: compile with no signing identity anywhere on the machine →
      # import the identity → sign and tar in a step that compiles nothing. The
      # import step sits BETWEEN the first and the last on purpose. Moving it
      # back above the build is a REQ-551 regression, not a formatting choice.
      #
      # Values reach the shell through `env:`, never by being pasted into the
      # script body: a `${{ }}` interpolation is a textual splice into the
      # program, and `$VERSION` is derived from a git ref. The smoke step below
      # has always done it this way; all three of these match it.
      #
      # macOS only. `build` compiles and stages the two binaries under
      # `dist/stage-<target>/` and stops there: it resolves no signing tool and
      # never reads TETON_SIGN_IDENTITY, which is why this step carries no
      # signing env for it to read. The ~30 minutes this spends — every
      # third-party crate's build script, plus a full llama.cpp cmake, running
      # as this user — is exactly the window REQ-551 exists to keep a Developer
      # ID private key out of (BR-1).
      #
      # That this step runs BEFORE the identity is imported is enforced rather
      # than asserted here: the selftest group "the import-after-build ordering
      # in release.yml" anchors on this step's `dist build` phase argument and
      # goes red if the import ever moves above it (BR-6 / ADR-551-2). This
      # comment points at that guard; it is not one, which is the same posture
      # the import step's own note takes.
      - name: Build (unsigned)
        if: contains(matrix.target, 'apple-darwin')
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          bash tools/release/package.sh "$TARGET" "$VERSION" dist build

      # The Linux leg keeps ONE invocation. `all` is byte for byte what
      # package.sh did before the phase argument existed (BR-5): there is no
      # keychain on this leg and no key to keep away from the compiler, so
      # splitting it would buy nothing and cost a step. TETON_SIGN_IDENTITY is
      # the empty string — the same value the target ternary produced for this
      # leg before the split — which package.sh reads as "dev build, stay
      # ad-hoc": the honest v1 answer for a target with no signing story
      # (REQ-550 BR-6), said out loud by the smoke rather than silently
      # skipped. Qualified with its REQ because REQ-551 has a BR-6 of its own —
      # the mechanical ordering assertion two steps down — and a bare "BR-6"
      # here reads as a pointer to the wrong rule.
      #
      # Deliberately NOT a copy of the `format(...)` identity expression: that
      # string exists in exactly two places (the import step and "Sign and
      # package"), and a third spelling of it here would be a third place to
      # forget.
      - name: Build and package (Linux, unsigned)
        if: ${{ !contains(matrix.target, 'apple-darwin') }}
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TETON_SIGN_IDENTITY: ""
        run: |
          bash tools/release/package.sh "$TARGET" "$VERSION" dist all

      # ADR-550-2: a throwaway keychain, created here and destroyed by the
      # cleanup step at the bottom of this job. Nothing persists on the runner
      # and no key material is ever written outside $RUNNER_TEMP.
      #
      # The certificate and its password arrive through `env:` rather than
      # being interpolated into the script body — the same posture the tap
      # token has carried since REQ-548. A `${{ secrets.X }}` inside a `run:`
      # block is a textual splice into the program before bash ever sees it;
      # through `env:` the value is data the shell reads, and `::add-mask::`
      # can cover what this step generates itself.
      #
      # Exit codes follow the house taxonomy (LESSON-442): 75 means the
      # identity could not be prepared, so nothing is known and nothing was
      # signed; 65 means the preparation RAN and what came out of the secret
      # is not a Developer ID Application identity for this team.
      #
      # BR-2: there is no "no certificate, carry on unsigned" branch here. A
      # macOS leg either finishes this step with a usable identity or the leg
      # dies — the "should we sign?" predicate is the target, never the
      # availability of the cert (LESSON-443's self-disabling-guard shape).
      #
      # WHERE this step sits is the whole of REQ-551, and it is enforced rather
      # than merely stated: it runs after "Build (unsigned)" and before "Sign
      # and package" so that no third-party build script ever executes beside
      # an unlocked keychain holding this key (BR-1). The group
      # "the import-after-build ordering in release.yml" in
      # tools/release/selftest.sh reads this file on every PR and fails unless
      # the import lies strictly between the two package.sh phase invocations
      # (BR-6 / ADR-551-2) — a comment claiming to be a guard is what
      # LESSON-443 is about, so this one names the guard instead of being it.
      # That assertion anchors on three literals: this step's `- name:` line
      # below, and the `dist build` / `dist pack` arguments on the two steps
      # around it. Renaming or rewriting any of them turns the selftest red on
      # purpose — the fix is to move the assertion in the same commit, never to
      # delete the anchor it lost.
      - name: Import the Developer ID signing identity (BR-2 / ADR-550-2)
        if: contains(matrix.target, 'apple-darwin')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          # The SAME expression the "Sign and package" step's
          # TETON_SIGN_IDENTITY uses, so the string this step asserts the
          # keychain contains is the string package.sh will later ask codesign
          # for — character for character, from one `format()` call duplicated
          # in two places rather than one spelling paraphrased into another.
          # Quoted for the same reason it is quoted there: the identity carries
          # a `: ` that bare YAML would read as a second mapping key.
          TETON_SIGN_IDENTITY: "${{ format('Developer ID Application: Atelier Fashion LLC ({0})', vars.APPLE_TEAM_ID) }}"
        run: |
          # THE PREAMBLE, and it is here because of where this step now sits.
          #
          # REQ-551 moved the identity import BELOW the compile, which is the
          # whole point — but it also put this step DOWNSTREAM OF UNTRUSTED
          # CODE. Every third-party crate's build script and the whole of
          # llama.cpp's cmake ran as this user before this line, and the runner
          # applies `$GITHUB_ENV` and `$GITHUB_PATH` BETWEEN steps: anything
          # they appended is already in this step's environment and already
          # ahead of the system directories on PATH. This is the step that holds
          # the raw certificate and its password, so the in-band channels are
          # closed before anything sensitive runs:
          #
          #   * BASH_ENV/ENV/CDPATH are unset. Bash sources `$BASH_ENV` before a
          #     non-interactive script's first line, so a build script that
          #     wrote BASH_ENV to $GITHUB_ENV gets its file sourced ahead of this
          #     body — HONESTLY: that sourcing has ALREADY HAPPENED by the time
          #     this line runs, and cannot be prevented from inside the script it
          #     precedes. What it plants is what these lines neutralise: the
          #     variable is unset so nothing further sources it, the functions it
          #     may have defined are removed, and the absolute paths below do not
          #     consult PATH or the function table at all. CDPATH goes because it
          #     silently changes where a `cd` lands.
          #   * the shell FUNCTIONS that could shadow the tools this step runs
          #     are removed. `export -f security` is a real thing an earlier step
          #     can arrange, and a function beats both PATH and a builtin.
          #   * PATH is REPLACED, not prepended. This step runs mktemp, base64,
          #     uuidgen, security, sed, tr and rm — every one of them in
          #     /usr/bin or /bin — so it needs nothing the runner image adds, and
          #     prepending would leave the inherited entries reachable for
          #     anything spelled without a path.
          #
          # Every invocation below is ABSOLUTE anyway. The unsets and the PATH
          # are defence in depth; `/usr/bin/security` is the thing that cannot be
          # redirected by a function, an alias or a PATH entry at all.
          #
          # WHAT THIS DOES NOT CLOSE, so the paragraph above is not read as more
          # than it is: a PERSISTENT BACKGROUND PROCESS started during the build
          # — one that outlives its step and is still running while the key is on
          # the machine — is runner-level compromise, and no preamble inside a
          # `run:` body addresses it. That is out of this REQ's threat model and
          # named in the spec as OQ-1: splitting build and sign into separate
          # JOBS is the fix for it, and it is recorded as future hardening rather
          # than pretended away here. Byte integrity is a third axis with a third
          # control — the build-provenance attestation (AC-2 / ADR-550-3) — and
          # nothing in this step substitutes for it.
          unset BASH_ENV ENV CDPATH || true
          unset -f security base64 uuidgen mktemp codesign tar shasum sed tr rm 2>/dev/null || true
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin

          # `set +e` EXPLICITLY, not merely "no set -e". GitHub's default shell
          # for a `run:` block is `bash -e {0}`, so errexit is already on when
          # this script starts, and under it an unchecked failure aborts the
          # step carrying that command's own exit status — 1 from `mktemp`, 1
          # from `uuidgen` — straight past the 65/75 taxonomy this step's
          # annotations depend on (LESSON-442). Every command below is instead
          # checked individually so each failure names its own stage. This one
          # line is the contract that makes those checks reachable; do not
          # delete it on the theory that `set -e` "was never turned on".
          set +e
          set -uo pipefail

          # Both paths are published to $GITHUB_ENV before anything is created,
          # so the `if: always()` cleanup can find and destroy whatever this
          # step managed to make before it died. Deriving them there instead
          # would be a second place that knows these names.
          #
          # Guarded, and the guard is a consequence of the `set +e` above: this
          # write used to be unchecked because errexit would have aborted the
          # step on a failed redirect. With errexit off it fails silently, and
          # a silent failure here is the worst kind — the step would carry on,
          # create a keychain and import a private key into it, and the
          # `if: always()` cleanup would find neither path in its environment.
          # A Developer ID identity would survive the job on a runner GitHub
          # may reuse. 75, not 65: an unwritable $GITHUB_ENV says nothing
          # whatsoever about the certificate.
          keychain="$RUNNER_TEMP/teton-signing-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.keychain-db"
          p12="$(/usr/bin/mktemp "$RUNNER_TEMP/teton-signing-cert.XXXXXXXX")"
          if ! {
            echo "TETON_SIGNING_KEYCHAIN=$keychain"
            echo "TETON_SIGNING_P12=$p12"
          } >>"$GITHUB_ENV"; then
            echo "::error title=Signing workspace UNCHECKED (BR-2)::Could not write the keychain and certificate paths to \$GITHUB_ENV ('$GITHUB_ENV'), so the 'if: always()' cleanup step would not know what to destroy. Refusing to import a Developer ID private key that nothing is guaranteed to clean up. This is a runner fault and says nothing about MACOS_CERT_P12. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            /bin/rm -f "$p12"
            exit 75
          fi

          # Checked on its own, and the message deliberately blames the temp
          # directory rather than the secret: with errexit off, a failed
          # `mktemp` leaves `$p12` empty and the very next thing this step does
          # is redirect the decoded certificate into `>""`. That would fail
          # too, but it would fail as "the certificate is unreadable", which
          # sends whoever reads the annotation to re-export a .p12 that was
          # never the problem. RUNNER_TEMP being unwritable is a runner fault,
          # so this is 75 (nothing was learned), never 65.
          if [ -z "$p12" ] || [ ! -e "$p12" ]; then
            echo "::error title=Signing workspace UNCHECKED (BR-2)::'mktemp' could not create a temporary file under RUNNER_TEMP ('$RUNNER_TEMP'), so there is nowhere to decode the certificate to. This is a temp-directory failure on the runner and says NOTHING about MACOS_CERT_P12. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          if [ -z "${MACOS_CERT_P12:-}" ] || [ -z "${MACOS_CERT_PASSWORD:-}" ]; then
            echo "::error title=Signing identity UNAVAILABLE (BR-2)::MACOS_CERT_P12 and/or MACOS_CERT_PASSWORD resolved empty on a macOS release leg, so no Developer ID identity could be imported and nothing can be signed. Either the release-signing environment did not attach to this run — its rules admit the 'main' branch and 'v*.*.*' tags, and this run is on '$GITHUB_REF_NAME' — or the secrets are missing from it. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          # Guarded because an empty needle is a needle that matches
          # everything: the assertion at the end of this step is a `case`
          # glob, and `*""*` accepts any keychain contents at all, including
          # an empty one. That would turn the one check standing between a
          # wrong certificate and a full build into a rubber stamp. If the
          # shared `format()` expression ever renders empty, this step must
          # say so rather than pass.
          if [ -z "${TETON_SIGN_IDENTITY:-}" ]; then
            echo "::error title=Signing identity string is empty (BR-2)::TETON_SIGN_IDENTITY rendered empty, so this step has no identity to assert the imported certificate against and the assertion below would accept anything. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          # Checked rather than assumed: an empty team id would make the
          # identity string below 'Developer ID Application: Atelier Fashion
          # LLC ()' and the assertion at the end of this step would match
          # nothing, reporting a bad certificate for what is really an
          # unconfigured variable.
          if [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error title=APPLE_TEAM_ID is not set (BR-2)::The release-signing environment variable APPLE_TEAM_ID resolved empty, so neither the signing identity nor the smoke gate's expected team could be named. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          # A run-random keychain password. It never leaves this step — the
          # cleanup step deletes the keychain by path, which needs no password
          # — and it is masked so no later `set -x` or error path can echo it.
          #
          # The emptiness test below is load-bearing precisely BECAUSE errexit
          # is off (see `set +e` at the top): a `uuidgen` that is missing or
          # fails leaves this empty and execution continues, so the check is
          # what turns that into a named 75 instead of a keychain with no
          # password.
          keychain_pw="$(/usr/bin/uuidgen)"
          if [ -z "$keychain_pw" ]; then
            echo "::error title=Signing keychain UNCHECKED (BR-2)::uuidgen produced no password for the throwaway keychain. Refusing to fall back to a fixed one — an empty or predictable keychain password on a shared runner image is not a thing this pipeline creates. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi
          echo "::add-mask::$keychain_pw"

          if ! printf '%s' "$MACOS_CERT_P12" | /usr/bin/base64 --decode >"$p12"; then
            echo "::error title=Signing certificate UNREADABLE (BR-2)::MACOS_CERT_P12 is not decodable base64, so no .p12 was produced and no identity was imported. Re-encode the certificate with 'base64 -i cert.p12' and update the secret. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi
          if [ ! -s "$p12" ]; then
            echo "::error title=Signing certificate UNREADABLE (BR-2)::MACOS_CERT_P12 decoded to an empty file, so there is no certificate to import. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          # Every `security` call is checked individually. Under a bare `set -e`
          # the step would die with security's own status and the log would say
          # which command failed but never which STAGE — and "the keychain
          # could not be created" and "the certificate would not import" are
          # different problems with different fixes.
          if ! /usr/bin/security create-keychain -p "$keychain_pw" "$keychain"; then
            echo "::error title=Signing keychain UNCHECKED (BR-2)::'/usr/bin/security create-keychain' failed, so there is nowhere to import the identity. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          # No arguments: this clears the lock-on-sleep and lock-after-timeout
          # settings entirely. The default 5-minute timeout used to be able to
          # relock the keychain partway through the llama.cpp build, which no
          # longer runs after this step (REQ-551) — the only thing between here
          # and codesign now is the signing step, measured in seconds. The
          # setting stays anyway: a keychain that relocks for any reason at all
          # — a queued step, a slow runner, a re-run — fails codesign with a
          # message about the certificate whose real cause is a clock.
          if ! /usr/bin/security set-keychain-settings "$keychain"; then
            echo "::error title=Signing keychain UNCHECKED (BR-2)::'/usr/bin/security set-keychain-settings' failed, so the keychain may auto-lock before the signing step and codesign would fail for a reason that has nothing to do with the certificate. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          if ! /usr/bin/security unlock-keychain -p "$keychain_pw" "$keychain"; then
            echo "::error title=Signing keychain UNCHECKED (BR-2)::'/usr/bin/security unlock-keychain' failed on the keychain this step just created. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          # -f pkcs12 rather than letting security sniff the format from a
          # temp file with no extension; -T /usr/bin/codesign is what allows
          # package.sh's codesign to use the key without a UI prompt that no
          # runner can answer.
          if ! /usr/bin/security import "$p12" -k "$keychain" -f pkcs12 \
              -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign; then
            echo "::error title=Signing certificate would not import (BR-2)::'/usr/bin/security import' rejected the decoded MACOS_CERT_P12 — most often a wrong MACOS_CERT_PASSWORD, or a .p12 exported without its private key. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          # The decoded .p12 dies HERE, the instant `security import` has
          # consumed it — not at the end of the job. Between this line and the
          # cleanup step sits everything that is left of this leg: the signing
          # step, the smoke that runs the binaries this job built, and the
          # upload. Since REQ-551 that no longer includes `cargo build` — the
          # build scripts of every third-party crate in the dependency tree and
          # a full llama.cpp cmake, as this user, with $RUNNER_TEMP readable —
          # because all of it ran BEFORE this step. The removal stays regardless:
          # a decoded key has no reason to outlive the import, since the key is
          # in the keychain now and codesign reads it from there. Narrowing the
          # window to a few milliseconds is the point.
          #
          # The `if: always()` cleanup still removes this path, and stays: this
          # line only runs when the import succeeded, and the failure paths
          # above are exactly the ones that leave a decoded key behind. Two
          # removals, one of which is unconditional — that is the design, not
          # duplication to tidy up.
          #
          # HONEST RESIDUAL, so nobody reads the paragraph above as a stronger
          # claim than it is.
          #
          # THE WINDOW, stated as what it now is rather than as what it was
          # (REQ-551, narrowed again in that REQ's verify pass, 2026-08-03):
          # it opens a few lines below this one — at the `security
          # list-keychains -d user -s` call, which is where the throwaway
          # keychain joins the search list codesign consults, NOT at `security
          # import`, which only puts the identity somewhere — and it closes in
          # the "Destroy the signing keychain (early)" step immediately after
          # "Sign and package". Between those two points runs the tail of this
          # step and one `package.sh … pack` invocation: seconds of
          # first-party code, all of it in this repository. The smoke — which
          # executes the binaries this job built, third-party library code and
          # all — and the artifact upload run AFTER the keychain is gone, so
          # they are no longer in the window at all.
          #
          # What is still true, and is the reason this note is not deleted:
          #
          #   * The file this removes was never plaintext. A .p12 is
          #     password-encrypted, and MACOS_CERT_PASSWORD lives in the
          #     environment of this step only. So the window being narrowed
          #     here was "an encrypted key blob, next to nothing that holds
          #     its password" — real, worth closing, and smaller than "an
          #     unencrypted PRIVATE KEY" sounds.
          #   * REQ-551 narrows what the KEY can reach; it does not make the
          #     build trusted. The compile that ran before this step still
          #     determines the BYTES the identity vouches for, and a hostile
          #     build script that plants something in `dist/stage-<target>/`
          #     gets it signed by a signing step that is doing exactly its
          #     job. That is a different axis and it has a different control:
          #     the provenance attestation in the `release` job
          #     (AC-2 / ADR-550-3) records which workflow, at which commit, on
          #     which runner produced these bytes. Nothing here is a substitute
          #     for it.
          #   * The earlier step can still write to this step's ENVIRONMENT.
          #     `$GITHUB_ENV` and `$GITHUB_PATH` are read by the runner between
          #     steps, so a hostile build script has a channel into the signing
          #     step even with no key on the machine while it runs. "Sign and
          #     package" scrubs the tool seams and puts the system directories
          #     first on PATH for precisely that reason; see its own note.
          #
          # CLOSED IN PART, 2026-08-01 (REQ-551), and closed further in that
          # REQ's verify pass, 2026-08-03. The recorded fix was to import AFTER
          # the build and sign as a separate step — a restructuring of this job
          # and of package.sh's contract, which REQ-550 accepted as a known
          # risk rather than an oversight. That restructuring is this step's
          # POSITION: "Build (unsigned)" compiles the dependency tree and
          # llama.cpp with no identity anywhere on the machine, and "Sign and
          # package" runs after this step. The verify pass then added the early
          # destroy, which is what makes "the window covers only first-party
          # signing code" (BR-1) literally true rather than nearly true.
          /bin/rm -f "$p12"

          # Without this, macOS prompts for keychain access the first time
          # codesign touches the key. There is no one at the runner to click
          # "Always Allow", so the build step would hang until the job timed
          # out rather than fail.
          if ! /usr/bin/security set-key-partition-list -S apple-tool:,apple: \
              -s -k "$keychain_pw" "$keychain" >/dev/null; then
            echo "::error title=Signing key is not usable without a prompt (BR-2)::'/usr/bin/security set-key-partition-list' failed, so codesign would block on a keychain-access dialog that nothing on this runner can dismiss. Failing now rather than hanging until the job timeout. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          # Captured BEFORE the search list is replaced, and published so the
          # cleanup step can put back what was actually there rather than the
          # guess it used to make. `security list-keychains -d user -s …`
          # REPLACES the list wholesale, so restoring a hardcoded
          # `login.keychain` silently drops any other keychain the runner image
          # had on the path — true today for GitHub's images, an assumption
          # about someone else's machine tomorrow.
          #
          # Not hypothetical: `security list-keychains -d user` returns TWO
          # entries on a stock macOS user session — the login keychain and
          # /Library/Keychains/System.keychain — so the old restore was already
          # dropping one of them on every macOS leg of every release.
          #
          # `security` prints one indented, quoted path per line; the sed strips
          # the indentation and the quotes and the tr flattens it to the single
          # space-separated line $GITHUB_ENV can carry. That flattening is why
          # the cleanup re-splits on whitespace, which means a keychain path
          # containing a space would be restored as two broken paths. No path in
          # any GitHub macOS image has one, and the previous code could not
          # represent such a path either; noted so the limit is known rather
          # than discovered.
          #
          # Unchecked on purpose: if this comes back empty the cleanup falls
          # back to login.keychain and says so, which is strictly the old
          # behaviour. Failing the build over a bookkeeping read would be worse
          # than the thing it bookkeeps.
          prior_keychains="$(/usr/bin/security list-keychains -d user \
            | /usr/bin/sed -e 's/^[[:space:]]*//' -e 's/"//g' | /usr/bin/tr '\n' ' ')"
          echo "TETON_PRIOR_KEYCHAINS=$prior_keychains" >>"$GITHUB_ENV"

          # login.keychain stays in the search list: removing it is how the
          # rest of the runner's tooling starts failing to find its own certs.
          if ! /usr/bin/security list-keychains -d user -s "$keychain" login.keychain; then
            echo "::error title=Signing keychain UNCHECKED (BR-2)::'/usr/bin/security list-keychains' failed, so the imported identity is not on the search path codesign consults. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          # The assertion, and the reason this step is worth its length: prove
          # the secret actually contained the Developer ID Application identity
          # this pipeline is going to ASK FOR, rather than letting codesign
          # discover it did not. Since REQ-551 moved this step below the build,
          # what it saves is seconds rather than a full llama.cpp compile — the
          # build has already happened by the time this runs. It is still the
          # assertion worth having: it names a wrong certificate as a wrong
          # certificate, in the step that owns the certificate, instead of
          # surfacing as a codesign failure two steps later.
          #
          # What changed and why it matters: this used to be a `grep -F
          # "Developer ID Application"` piped into a `grep -Fq "($TEAM)"`, which
          # asserts only that SOME line mentions the product name and that the
          # same line ends with the team id. It would pass on
          # "Developer ID Application: Some Other Org (545BU9G9D6)" — a
          # different subject entirely, with the right team suffix. What
          # package.sh hands codesign is not a pair of substrings, it is one
          # exact string, so that is what gets asserted: the identity is built
          # HERE from the same `format()` expression the Build step's
          # TETON_SIGN_IDENTITY uses (see this step's env), so the two steps
          # cannot drift — they are the same expression written twice, not two
          # spellings of the same idea.
          #
          # `case`, not `grep -Fq`, and the reason is the taxonomy — the same
          # reasoning verify-signature.sh spells out at its own 65-producing
          # test. This is the only branch in this step that returns 65 ("the
          # certificate is wrong"), so it must not be able to fail for a reason
          # of its own: a grep that is missing, broken, or killed exits
          # non-zero, `! grep` reads that as "the identity is not there", and
          # the gate announces a bad certificate on the strength of a missing
          # tool (LESSON-442). A `case` is the shell itself and has no exit
          # status to misread. It is also a better -F than -F: the needle is
          # quoted, so a glob character in a team id or org name stays literal.
          # The `|| true` this line used to carry re-opened the exact hole the
          # `case` was chosen to close. A `security` that is missing, killed,
          # or fails for a reason of its own exits non-zero and prints nothing
          # useful; `|| true` swallowed that status, `$identities` fell through
          # empty, and the `case` below reached its `*` branch and announced
          # 65 — "the certificate is wrong" — on the strength of a TOOL
          # failure. That is a forged rejection, and it is the same
          # LESSON-442 shape the `! grep` version had; moving from `grep` to
          # `case` only relocated it.
          #
          # So the status is captured explicitly and a failed read is 75. The
          # empty test is part of the same guard rather than a separate
          # nicety: `security` can exit 0 having written nothing (an empty
          # keychain prints only a count line on some releases), and an empty
          # list is not evidence about the certificate either. Only a list
          # that was READ SUCCESSFULLY and came back non-empty can support the
          # 65 below.
          fi_status=0
          identities="$(/usr/bin/security find-identity -v -p codesigning "$keychain" 2>&1)" \
            || fi_status=$?
          printf '%s\n' "$identities"
          if [ "$fi_status" -ne 0 ] || [ -z "$identities" ]; then
            echo "::error title=Signing identity UNCHECKED (BR-2)::'/usr/bin/security find-identity -v -p codesigning' exited $fi_status and/or printed nothing, so the keychain's contents could not be READ. Nothing was learned about MACOS_CERT_P12 — this is a tool failure on the runner, deliberately NOT reported as a wrong certificate. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
            exit 75
          fi

          case "$identities" in
            *"$TETON_SIGN_IDENTITY"*) : ;;
            *)
              echo "::error title=No '$TETON_SIGN_IDENTITY' in the keychain (BR-2)::MACOS_CERT_P12 imported, but no codesigning identity in the keychain is named exactly '$TETON_SIGN_IDENTITY' — see the list above for what it does carry. That is the identity package.sh will hand codesign, so a near miss (another org with this team id, a Mac Development or Apple Distribution certificate, a renamed subject) is still a build that cannot sign. The build already finished — this fails the leg before anything is signed, and the binaries it produced are discarded with the job."
              exit 65
              ;;
          esac

          echo "::notice title=Signing identity ready (BR-2)::A Developer ID Application identity for team $APPLE_TEAM_ID is in a throwaway keychain for this leg. It is destroyed by 'Destroy the signing keychain (early)' the moment signing finishes — before the smoke and the upload run — and the 'if: always()' cleanup at the end of the job is the backstop that covers every path this step can die on."

      # macOS only, and the other half of the split above. `pack` signs the two
      # staged binaries, verifies its own signatures, tars and hashes them. It
      # BUILDS nothing: it packs what "Build (unsigned)" staged, and a missing
      # or half-populated staging directory is a hard 70 rather than a tarball
      # (ADR-551-1) — a pack that followed no build cannot ship bytes. Seconds
      # of first-party code where there used to be half an hour of third-party
      # compilation holding the same unlocked keychain (BR-1). This step is the
      # LAST thing in the job that needs the identity: the step immediately
      # below destroys the keychain, so the smoke and the upload — which used
      # to sit inside the window — now run with no signing credential on the
      # machine at all.
      #
      # TETON_SIGN_IDENTITY is conditioned on the target rather than on whether
      # a certificate happens to be present (ADR-550-1/BR-2): a macOS leg signs
      # or dies, and a guard that switches itself off when its input is missing
      # is not a guard (LESSON-443). The ternary is kept WHOLE even though the
      # `if:` above already makes this step macOS-only, because it is one half
      # of a matched pair — the import step's own TETON_SIGN_IDENTITY is the
      # same `format(...)` call, so the string the keychain was asserted to
      # contain and the string codesign is handed here cannot describe
      # different identities. A change to the org name or the team-id variable
      # moves both at once. If you edit one, edit the other; there is no third
      # copy.
      - name: Sign and package
        if: contains(matrix.target, 'apple-darwin')
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
          # Quoted because the identity carries a `: ` that bare YAML would
          # read as a second mapping key, not because the expression needs it.
          TETON_SIGN_IDENTITY: "${{ contains(matrix.target, 'apple-darwin') && format('Developer ID Application: Atelier Fashion LLC ({0})', vars.APPLE_TEAM_ID) || '' }}"
        run: |
          # Moving the identity below the build takes the KEY away from the
          # compile; it does not take away the compile's channel INTO this
          # step. A hostile build script in "Build (unsigned)" can append to
          # $GITHUB_ENV and $GITHUB_PATH, and the runner applies both BETWEEN
          # steps — so whatever it wrote is already in this step's environment
          # and already ahead of the system directories on PATH by the time
          # this line runs. These lines close the IN-BAND channels:
          #
          #   * the tool seams are unset, so package.sh cannot be pointed at
          #     someone else's `codesign` by an inherited TETON_CODESIGN, and
          #     its own in-CI refusal of that seam cannot be waved through by
          #     an inherited TETON_ALLOW_TOOL_SEAM;
          #   * BASH_ENV/ENV/CDPATH go too. Bash sources `$BASH_ENV` before a
          #     non-interactive script's first line, so an inherited one is read
          #     ahead of this body AND ahead of `bash tools/release/package.sh`
          #     below. Unsetting it here is what keeps package.sh from being
          #     handed a pre-populated shell; what it may already have planted
          #     into THIS shell is handled by the line under it.
          #   * the shell FUNCTIONS that could shadow the tools this step's work
          #     depends on are removed — a function beats PATH and beats a
          #     builtin, and `export -f codesign` is something an earlier step
          #     can arrange.
          #   * the system directories go FIRST on PATH, so codesign, tar and
          #     shasum resolve to /usr/bin regardless of what was prepended.
          #
          # LESSON-460's family: a guard that ambient environment can defeat is
          # not a guard. package.sh's seam refusal is the guard; this is what
          # keeps its inputs from being chosen by the step it is guarding
          # against. (lib.sh's `tool_or_unchecked` carries the matching half:
          # an unoverridden tool name must resolve to an ABSOLUTE PATH, so a
          # surviving function or alias reads as "no such tool" rather than as
          # the signer.) $PATH is extended rather than replaced because this
          # step still needs the runner's own toolchain entries behind them.
          #
          # BE HONEST ABOUT THE RESIDUAL. This closes the channels that run
          # THROUGH this step's environment. It does not close a PERSISTENT
          # BACKGROUND PROCESS started during the build and still running while
          # the key is on the machine — that is runner-level compromise, it is
          # outside this REQ's threat model, and the spec records the fix as
          # OQ-1 (split build and sign into separate JOBS) rather than
          # pretending a `run:` preamble reaches it. Nor does it say anything
          # about the BYTES: what "Build (unsigned)" staged is what gets signed,
          # and the control on that axis is the build-provenance attestation
          # (AC-2 / ADR-550-3), not these lines.
          unset TETON_CODESIGN TETON_ALLOW_TOOL_SEAM BASH_ENV ENV CDPATH
          unset -f codesign tar shasum security 2>/dev/null || true
          export PATH="/usr/bin:/bin:/usr/sbin:/sbin:$PATH"

          bash tools/release/package.sh "$TARGET" "$VERSION" dist pack

      # THE EARLY DESTROY, and the step that makes BR-1's claim literal rather
      # than nearly true. The identity now exists on this runner from the
      # import step's `list-keychains` call through the signing step above and
      # no further: the smoke and the artifact upload — both of which run code
      # this job did not write, the smoke by executing the freshly built
      # binaries — run with no signing keychain present at all. Before this
      # step existed they sat inside the window, and the import step's residual
      # note said so out loud rather than pretending otherwise.
      #
      # NOT `always()`, deliberately. This is the happy-path narrowing: it runs
      # when the macOS leg reached this point, which is exactly when there is a
      # keychain worth destroying early. The `if: always()` cleanup at the
      # bottom of the job stays and is now a FAILURE-PATH BACKSTOP — it is what
      # covers an import that died halfway, a cancelled job, or a signing step
      # that failed before this one could run. Two removals with different
      # triggers, not duplication to tidy up: deleting either one leaves a real
      # path uncovered.
      #
      # After this step has run, the backstop harmlessly no-ops. Its p12
      # removal is `[ -e ]`-guarded, and its `delete-keychain` and
      # `list-keychains` calls are both `|| echo ::notice` — nothing in it can
      # turn a green leg red because the thing it was asked to destroy is
      # already gone, which is the same tolerance it has always needed for the
      # early-failure paths.
      #
      # Same tolerant semantics as that backstop, for the same reason: a
      # cleanup that fails a green build is a cleanup people delete.
      - name: Destroy the signing keychain (early)
        if: contains(matrix.target, 'apple-darwin')
        run: |
          # The same preamble the import step carries, for the same reason and
          # with the same honest limit: this step runs downstream of the
          # compile, `$GITHUB_ENV`/`$GITHUB_PATH` are applied between steps, and
          # a `security` that resolves to an inherited shell function would make
          # this step REPORT a destroyed keychain without destroying one — which
          # is worse than not running it, because the notice at the bottom is
          # what BR-1's claim rests on. Everything below runs from /usr/bin.
          # (A persistent background process from the build is runner-level
          # compromise and out of scope here too — spec OQ-1.)
          unset BASH_ENV ENV CDPATH || true
          unset -f security rm 2>/dev/null || true
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin

          set -uo pipefail

          # Both may be unset — the import step publishes them before it
          # creates anything, but `set -u` would abort here on a path where it
          # never ran at all.
          keychain="${TETON_SIGNING_KEYCHAIN:-}"
          p12="${TETON_SIGNING_P12:-}"

          # Attempted whenever the path is SET, never gated on the file
          # existing: a guard that switches itself off when its input looks
          # absent is LESSON-443's shape, and a skip here would leave the
          # identity alive through the smoke while this step reported success.
          #
          # GRADED ON THE POST-CONDITION, not on the tool's exit status. What
          # BR-1 needs is the keychain GONE; `security delete-keychain` exiting
          # 0 is evidence for that and not the thing itself, and a delete that
          # returns success while the file is still on disk (a keychain held
          # open elsewhere, a locked volume) would otherwise be reported as a
          # closed window that is still open. `$destroyed` is set from `[ ! -e ]`
          # and from nothing else, and it is what decides whether the closing
          # notice may be printed at all — one step must not emit a warning
          # saying the identity may have survived AND a notice saying it did
          # not.
          destroyed=0
          if [ -n "$keychain" ]; then
            delete_status=0
            /usr/bin/security delete-keychain "$keychain" || delete_status=$?

            if [ -e "$keychain" ]; then
              echo "::warning title=Signing keychain not destroyed early::'security delete-keychain $keychain' exited $delete_status and the file is STILL ON DISK, so the identity may outlive this step and the narrowed window is wider than this step claims. The 'if: always()' cleanup at the end of this job tries again. Warned rather than failed: the bytes are already signed and stopping the leg here would not remove anything."
            elif [ "$delete_status" -eq 0 ]; then
              echo "deleted keychain: $keychain"
              destroyed=1
            else
              echo "::notice title=No signing keychain to delete::'security delete-keychain $keychain' exited $delete_status and nothing is at that path — either it was never created or it is already gone."
              destroyed=1
            fi
          fi

          # The p12 is normally gone already (the import step removes it the
          # instant `security import` consumes it). Kept for the same reason
          # the backstop keeps it: this step is now the first cleanup a
          # successful leg reaches, and it should not depend on a removal two
          # steps up having happened.
          if [ -n "$p12" ] && [ -e "$p12" ]; then
            /bin/rm -f "$p12" && echo "removed decoded certificate: $p12"
          fi

          # Restore the search list the import step captured before replacing
          # it wholesale. Leaving the now-deleted throwaway keychain named in
          # it makes every later `security` call on this runner complain —
          # including the ones the smoke step's own tooling may make.
          prior="${TETON_PRIOR_KEYCHAINS:-}"
          if [ -z "$prior" ]; then
            prior="login.keychain"
            echo "::notice title=Keychain search list restored from the default::The runner's original search list was not captured, so 'login.keychain' is being restored instead of whatever was actually there."
          fi

          # Deliberately unquoted: $prior is a space-separated list of keychain
          # paths that must reach `security` as separate arguments, which is
          # the one thing quoting it would prevent.
          # shellcheck disable=SC2086
          /usr/bin/security list-keychains -d user -s $prior \
            || echo "::notice title=Keychain search list not restored::'security list-keychains -d user -s $prior' did not succeed. The keychain itself is gone either way; this is noted rather than failed."

          # CONDITIONAL, and that is the point of grading the delete on its
          # post-condition above. This notice is what BR-1's "the window closes
          # here" rests on; printing it beside a warning that the keychain is
          # still on disk would put two contradictory annotations on one step and
          # let a reader pick the reassuring one.
          if [ "$destroyed" -eq 1 ]; then
            echo "::notice title=Signing key material removed (BR-1)::The signing keychain was destroyed the moment signing finished. Everything after this step — the tarball smoke and the artifact upload — runs with no Developer ID identity on this runner."
          fi

      # The gate that decides whether these bytes ship (BR-7/BR-9): version
      # strings, the release build's refusal of TETON_TEST_SEAMS, and a live
      # daemon handshake — all against the unpacked tarball, not the build tree.
      # On the macOS targets it first asserts that both shipped binaries carry
      # a Developer ID signature from TETON_SMOKE_TEAM_ID (BR-2), which is the
      # second, independent look at what the import and package steps above
      # believed they did — this one against the extracted tarball.
      #
      #   0   PASS
      #   64  UNCHECKED-by-usage. On a macOS target this is smoke.sh refusing
      #       to run with no TETON_SMOKE_TEAM_ID to check the signature
      #       against; it deliberately does NOT read an absent team id as
      #       "skip the signature check". Handled by the `*` branch below.
      #   65  FAILED     red, ::error::. The artifact is bad. Do not release.
      #   *   UNCHECKED  red, ::error::. The smoke could not run, so nothing is
      #                  known about the artifact — which is not a pass.
      - name: Smoke the tarball (BR-7/BR-9)
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          TARGET: ${{ matrix.target }}
          # Conditioned on the target for symmetry with TETON_SIGN_IDENTITY
          # above, though smoke.sh needs no help here: it reads the target off
          # the tarball's own name and only demands a team id for the darwin
          # ones. The Linux leg gets the empty string and smoke.sh prints that
          # it shipped unsigned rather than silently skipping (REQ-550 BR-6).
          TETON_SMOKE_TEAM_ID: ${{ contains(matrix.target, 'apple-darwin') && vars.APPLE_TEAM_ID || '' }}
        run: |
          tarball="dist/teton-v$VERSION-$TARGET.tar.gz"

          set +e
          bash tools/release/smoke.sh "$tarball" "$VERSION"
          status=$?
          set -e

          case "$status" in
            0)
              echo "::notice title=Smoke PASSED ($TARGET)::Both binaries report $VERSION, the release build refused TETON_TEST_SEAMS=1, and teton doctor handshook a live teton-code daemon."
              ;;
            65)
              echo "::error title=Smoke FAILED ($TARGET)::A shipped-artifact assertion failed for $tarball — see the log for which one. These bytes must not be released."
              ;;
            *)
              echo "::error title=Smoke UNCHECKED ($TARGET)::The smoke harness could not run against $tarball (exit $status), so nothing was learned about the artifact. Failing rather than publishing an unexercised binary."
              ;;
          esac
          exit "$status"

      # SHA-pinned for the same reason this job's checkout is: `build` holds
      # the signing certificate, and this step is the hand-off that carries
      # the signed bytes out of the job. See the carve-out note above.
      - name: Upload target artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: teton-${{ matrix.target }}
          # The sidecar `.sha256` is deliberately left behind: the release's
          # checksums are recomputed from the uploaded files (BR-5).
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      # THE BACKSTOP. Since the verify pass added "Destroy the signing keychain
      # (early)" immediately after signing, a leg that gets that far has already
      # destroyed everything this step looks for, and this runs as a no-op that
      # prints a notice. That is the intended division: the early step is the
      # happy path, this one is every other path.
      #
      # `always()`, and that is the whole point of the step: the paths this
      # deletes exist precisely when something went wrong partway through the
      # import, and a private key surviving on a runner because the build
      # failed is the failure mode worth guarding. Hosted runners are torn
      # down after the job, so this is defence in depth rather than the only
      # thing standing between the key and the next tenant — but "the VM will
      # be destroyed" is an assumption about someone else's infrastructure,
      # and this pipeline does not leave key material to it (ADR-550-2).
      #
      # Nothing in here can fail the job. A cleanup that turns a green build
      # red because the keychain it was asked to delete never existed is a
      # cleanup people delete.
      - name: Destroy the signing keychain
        if: always() && contains(matrix.target, 'apple-darwin')
        run: |
          # The same preamble as the import and early-destroy steps. Weakest
          # case of the three — by the time this runs the key is normally
          # already gone — but it is the step that covers the FAILURE paths,
          # which are exactly the runs where an earlier step did something
          # unexpected, and a `security` shadowed by an inherited shell function
          # would turn this backstop into a no-op that says it worked.
          unset BASH_ENV ENV CDPATH || true
          unset -f security rm 2>/dev/null || true
          export PATH=/usr/bin:/bin:/usr/sbin:/sbin

          set -uo pipefail

          # Both may be unset: this step also runs when the import step never
          # got far enough to publish them (a failed checkout, a cancelled
          # job), and `set -u` would otherwise abort the cleanup at the first
          # reference.
          keychain="${TETON_SIGNING_KEYCHAIN:-}"
          p12="${TETON_SIGNING_P12:-}"

          if [ -n "$keychain" ]; then
            /usr/bin/security delete-keychain "$keychain" \
              && echo "deleted keychain: $keychain" \
              || echo "::notice title=No signing keychain to delete::'security delete-keychain $keychain' did not succeed. Either it was never created (the import step failed early) or it is already gone."
          fi

          # The BACKSTOP, not the primary removal. On the happy path the import
          # step deleted this file the moment `security import` consumed it, so
          # this is a no-op and prints nothing. It earns its place on the
          # failure paths — a step that died between decoding the .p12 and
          # importing it is exactly where a private key survives, and that is
          # the path with no other cleanup on it.
          if [ -n "$p12" ] && [ -e "$p12" ]; then
            /bin/rm -f "$p12" && echo "removed decoded certificate: $p12"
          fi

          # Restore the search list the import step captured before replacing
          # it. It replaced the list WHOLESALE, so leaving the throwaway
          # keychain — now deleted — named in it makes every later `security`
          # call on this runner complain, and restoring a hardcoded
          # `login.keychain` would silently drop anything else the runner image
          # had on the path.
          prior="${TETON_PRIOR_KEYCHAINS:-}"
          if [ -z "$prior" ]; then
            # The import step never reached the capture (it died early, or the
            # capture itself came back empty). login.keychain is the documented
            # default on GitHub's macOS images and was this step's unconditional
            # behaviour before the capture existed, so falling back to it
            # restores a working runner rather than leaving a dangling entry.
            prior="login.keychain"
            echo "::notice title=Keychain search list restored from the default::The runner's original search list was not captured, so 'login.keychain' is being restored instead of whatever was actually there."
          fi

          # Deliberately unquoted: $prior is a space-separated list of keychain
          # paths that must reach `security` as separate arguments, which is
          # the one thing quoting it would prevent.
          # shellcheck disable=SC2086
          /usr/bin/security list-keychains -d user -s $prior \
            || echo "::notice title=Keychain search list not restored::'security list-keychains -d user -s $prior' did not succeed. The job is finished either way; this is noted rather than failed."

          echo "::notice title=Signing key material removed::No certificate or keychain from this leg survives the job."

  release:
    name: checksums · GitHub Release
    needs: [preflight, build]
    runs-on: ubuntu-24.04
    permissions:
      # Scoped to this job, not the workflow: it is the only one that writes.
      contents: write
      # ADR-550-3. Both exist for the attestation step below and nothing else:
      # `id-token: write` lets this run mint the OIDC token Sigstore signs the
      # provenance with, and `attestations: write` lets it record the result
      # against this repository. They are the two permissions in this workflow
      # that would let a compromised step speak AS this repository's build, so
      # they stay on the one job that has a reason to.
      id-token: write
      attestations: write
    env:
      # The `build` matrix has three legs, so a complete release has three
      # tarballs. Written once, here, because the number appears in an
      # assertion, in an error message and in the "published" notice, and three
      # hardcoded 3s are three places to forget when a fourth target lands —
      # the failure mode being a gate that keeps passing on a release missing a
      # platform. tools/release/verify-attestations-batch.sh carries the same
      # expectation for its own inputs.
      EXPECTED_TARGETS: "3"
    steps:
      # SHA-pinned, unlike `preflight`'s and `build`'s: this job's token can
      # write the repository AND mint the OIDC identity our provenance is
      # signed with, so the first action it runs is not left on a mutable tag.
      # See the carve-out note in the `build` job above.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job's token can write to the repository. `persist-credentials`
          # would leave it in .git/config for every later step to read; `gh`
          # takes it from the environment instead, and nothing here pushes.
          # The remote itself stays, so `gh` still resolves the repository.
          persist-credentials: false

      # SHA-pinned: this step runs in a credential-bearing job
      # (contents/id-token/attestations: write) and it produces the exact
      # bytes the next steps attest and publish. See the carve-out note in
      # the `build` job above.
      - name: Download every target's tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: staging
          pattern: teton-*
          merge-multiple: true

      # BR-5: the published checksums are computed HERE, from the files that are
      # about to be uploaded — never carried forward from the build legs. A hash
      # that travelled separately from its bytes is a hash that can describe
      # different bytes.
      - name: Compute checksums.txt from the uploaded artifacts (BR-5)
        working-directory: staging
        run: |
          # `set -e` matters more here than anywhere else in the workflow.
          # Without it this step hashed whatever it could, ended on a `cat`, and
          # exited 0 — so a partially-written checksums.txt was published as if
          # it were complete, and the gate could not fail.
          set -euo pipefail
          ls -l

          work="${RUNNER_TEMP:-/tmp}"

          find . -maxdepth 1 -type f -name '*.tar.gz' -exec basename {} ';' \
            | sort >"$work/tarballs.txt"
          count="$(grep -c . "$work/tarballs.txt" || true)"
          if [ "${count:-0}" -ne "$EXPECTED_TARGETS" ]; then
            echo "::error title=Missing release artifacts::Expected $EXPECTED_TARGETS tarballs (one per target) but found ${count:-0}. A release that silently omits a platform is worse than no release — stopping before publish."
            exit 65
          fi

          # Guarded, not left to `-e`: hashing failing outright is a different
          # thing from hashing the wrong set, and a step that dies on a bare 1
          # here would say neither.
          if ! sha256sum ./*.tar.gz | sed 's|\./||' >checksums.txt; then
            echo "::error title=Hashing the release artifacts FAILED (BR-5)::sha256sum could not hash the staged tarballs, so no checksums.txt was produced and nothing is known about these bytes. Nothing was published."
            exit 75
          fi

          # Two assertions, because neither covers the other: the line count
          # catches a truncated file, the set comparison catches a file with the
          # right number of lines naming the wrong things. A checksums.txt that
          # covers only some of the assets is worse than none at all — a user
          # who verifies what it lists would believe they had verified the
          # release.
          hashed="$(grep -c . checksums.txt || true)"
          if [ "${hashed:-0}" -ne "$count" ]; then
            echo "::error title=checksums.txt is incomplete (BR-5)::$count tarballs are about to be published but checksums.txt carries ${hashed:-0} lines. Nothing was published."
            exit 65
          fi

          awk '{ name = $2; sub(/^\*/, "", name); print name }' checksums.txt \
            | sort >"$work/hashed.txt"
          if ! diff -u "$work/tarballs.txt" "$work/hashed.txt"; then
            echo "::error title=checksums.txt does not describe these artifacts (BR-5)::The filenames in checksums.txt are not the set of tarballs about to be uploaded — in the diff above, '-' lines are present but unhashed and '+' lines are hashed but absent. Nothing was published."
            exit 65
          fi

          echo "checksums.txt:"
          cat checksums.txt

      # AC-2 / ADR-550-3. Provenance for these exact bytes: which workflow
      # file, at which commit, on which runner built them — signed with this
      # run's OIDC identity and recorded against this repository. The action
      # hashes the staged files itself, so the subjects are the bytes sitting
      # in `staging/` right now, which are the bytes the publish step below
      # uploads. Nothing is handed a digest computed somewhere else.
      #
      # BEFORE the publish, not after: if provenance cannot be produced, the
      # right outcome is a release that never appeared, not a published
      # release racing a gate.
      #
      # Not conditioned on `publish`. A dry run attests its own staged
      # tarballs and the verification gate below then checks those same bytes,
      # so the whole provenance path — mint, record, verify — is exercisable
      # from `workflow_dispatch` without burning a tag, which is what the rest
      # of this workflow is built to allow. The attestation a dry run leaves
      # behind names bytes nobody published, which is true and harmless.
      #
      # SHA-pinned like every other third-party action here (REQ-548 audit
      # posture, LESSON-455: all of them, not most). `actions/*` is
      # first-party, but this one mints signed claims about our artifacts, so
      # it is pinned anyway — the tag it would otherwise track is a mutable
      # pointer, and "the provenance action changed under us" is exactly the
      # class of change that must show up in a diff.
      - name: Attest build provenance for the tarballs (AC-2 / ADR-550-3)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          # checksums.txt is a SUBJECT, not a bystander. It used to be left out,
          # and that left the one file users are told to trust as the only
          # published asset with no provenance at all: an attacker who could
          # replace it on the release page could relist any digests they liked,
          # and every reader following the runbook's `shasum -c` would verify
          # against the attacker's numbers and see a pass. Attesting it closes
          # that: the digest list is now itself covered by a claim naming this
          # workflow, at this commit, and the gate below re-verifies it as one
          # of the four subjects.
          #
          # Multi-line because `subject-path` takes a newline-separated list of
          # globs; the action hashes what each one expands to on disk.
          subject-path: |
            staging/*.tar.gz
            staging/checksums.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          PUBLISH: ${{ needs.preflight.outputs.publish }}
        run: |
          set -euo pipefail

          notes="$(mktemp)"

          # REQ-548 OQ-3 — "release notes generated from the commit log, or
          # hand-written highlights?" — is answered here, and the answer is
          # BOTH. Everything else in this body is generated from what the run
          # itself did (platforms, the smoke gate, the checksums it computed);
          # the "Upgrade notes" section below is the hand-written half, lifted
          # from the topmost section of CHANGELOG.md. Neither half can say what
          # the other says: a generated line cannot know that a routing change
          # widened what leaves a user's machine, and a hand-written one cannot
          # know which digests this run produced.
          #
          # THE MISSING-CHANGELOG CASE IS NOT A FAILURE. Exit 75 from the
          # script means "no changelog, or no section in it" — the release goes
          # out with no Upgrade notes section and nothing else changes. A
          # release must never be blocked because somebody did not write a
          # changelog entry. Any OTHER non-zero status is the script itself
          # being broken or absent, which is the release tooling in an unknown
          # state, and that does stop the run: those two outcomes have separate
          # exit codes precisely so this step can treat them differently.
          #
          # Exit 65 is the third one, and it is why the `*)` arm below is not
          # decoration. It means the script READ the changelog and will not
          # publish what it found — an unbalanced fence, headings it cannot
          # reach, or a section forging this body's own `### Checksums` block.
          # Every one of those used to arrive as 75, so the notice below would
          # state that CHANGELOG.md had nothing to publish while the file sat
          # there full of notes, and the release shipped with the disclosure
          # gone. The `*)` arm stops the run instead.
          upgrade_notes=""
          notes_status=0
          upgrade_notes="$(bash tools/release/changelog-section.sh)" || notes_status=$?
          case "$notes_status" in
            0) ;;
            75)
              echo "::notice title=No upgrade notes::CHANGELOG.md has no version section to publish, so this release body carries no Upgrade notes section. Everything else in it is unaffected."
              ;;
            *)
              echo "::error title=Upgrade notes could not be read::tools/release/changelog-section.sh exited $notes_status, which is neither 'a section was found' (0) nor 'there is nothing to publish' (75). That is the release tooling failing, not a missing changelog entry, so this run stops rather than publishing a body whose hand-written half silently vanished."
              exit "$notes_status"
              ;;
          esac

          # The backticks below are markdown — code fences and inline code in
          # the release body — so the format strings are single-quoted on
          # purpose and every value is passed as a printf argument.
          # shellcheck disable=SC2016
          {
            printf '## teton %s\n\n' "$VERSION"
            printf '```sh\nbrew install atelier-fashion/tap/teton\n```\n\n'
            printf '### Platforms\n\n'
            printf -- '- `aarch64-apple-darwin` — built and smoke-tested natively on macOS arm64.\n'
            printf -- '- `x86_64-apple-darwin` — **Rosetta-verified**: cross-compiled on an arm64 runner and smoke-tested under Rosetta 2 (GitHub no longer offers Intel macOS runners). That proves the binary loads and runs its CPU paths; it is not evidence from native Intel hardware.\n'
            printf -- '- `x86_64-unknown-linux-gnu` — built and smoke-tested natively on Linux.\n\n'
            # REQ-550 BR-6, stated at exactly the strength that is true. The team id is
            # a literal here and a variable everywhere else on purpose: this
            # job declares no environment, so `vars.APPLE_TEAM_ID` — which
            # lives on `release-signing` — does not resolve in it, and a notes
            # line that silently rendered "Team ``" would be worse than a
            # spelled-out one.
            #
            # Be clear about what that costs, because an earlier version of
            # this comment was not: this literal is UNVERIFIED AT RUN TIME.
            # Nothing in this workflow compares it against the team the
            # binaries were actually signed with. The smoke gate checks the
            # signature against `vars.APPLE_TEAM_ID`, which is a different
            # value read from a different place — if the two ever disagree,
            # every gate in this pipeline still goes green and the release
            # notes simply state the wrong team. What pins them together is a
            # consistency case in tools/release/selftest.sh, which reads this
            # file and the others carrying the id and fails when they diverge.
            # That check runs in CI, not here. If you change the team id,
            # changing it in one place is caught by that selftest and by
            # nothing else in this workflow.
            printf -- '- macOS binaries (`teton` and `teton-code`) are signed with an Apple Developer ID Application certificate (Team `545BU9G9D6`); the release gate verified that signature against these exact tarballs. Linux binaries are **unsigned** in v1.\n\n'
            printf 'Every artifact passed the release smoke gate: `teton` and `teton-code` both report %s, the release build refuses `TETON_TEST_SEAMS=1` rather than honouring the test seams, and `teton doctor` completed a live handshake against a freshly started daemon.\n\n' "$VERSION"
            # Here rather than at the end: what an upgrade DOES to a machine
            # that is already running is the thing a reader needs before they
            # decide to take it, and the checksums are what they need after.
            # The section is printed verbatim — `%s`, one argument — so nothing
            # in this pipeline can reword a disclosure on its way to the page.
            if [ -n "$upgrade_notes" ]; then
              printf '### Upgrade notes\n\n'
              printf '%s\n\n' "$upgrade_notes"
            fi
            printf '### Checksums (sha256)\n\n```\n'
            cat staging/checksums.txt
            printf '```\n'
          } >"$notes"

          # The dry-run branch is a step that RUNS and says what it did, not a
          # skipped job: "publish was skipped, here is the reason and here is
          # exactly what would have gone out" is checkable; a grey box is not.
          if [ "$PUBLISH" != "true" ]; then
            echo "::notice title=Release publish SKIPPED::This run built, smoked and checksummed every target but published nothing (dry run, or dispatched from a branch rather than a tag). Everything below is what a real run would have released."
            echo "--- assets that would be uploaded ---"
            ls -1 staging/
            echo "--- release notes ---"
            cat "$notes"
            exit 0
          fi

          # Idempotent on purpose. `gh release create` errors on an existing
          # release, so before this a run that published the page and then
          # failed at the tap could only be retried by DELETING the release —
          # which is what v0.1.1 had to do. The publish is the cheap, early
          # half of a release; the expensive, fallible half is everything
          # after it, and that half has to be re-runnable.
          # One list, one title: the create and retry branches below must
          # publish exactly the same set, and a fourth asset added to one arm
          # only would be invisible — the staged-tarball count upstream counts
          # what was BUILT, not what was uploaded.
          assets=(staging/*.tar.gz staging/checksums.txt)
          title="teton $VERSION"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # A release already exists for this tag. That is a retry only if it
            # describes the same commit this run built; a tag that has MOVED
            # under a published release is ambiguous — the bytes on the page
            # would no longer be the bytes of the tag people can check out —
            # so it stops rather than quietly re-pointing anything.
            tag_sha="$(git rev-parse "refs/tags/$TAG^{commit}" 2>/dev/null || true)"
            if [ -n "$tag_sha" ] && [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "::error title=Release exists for a different commit::$TAG is already published, but it now resolves to $tag_sha while this run built $GITHUB_SHA. Re-pointing a published release at different bytes is not something this workflow will do silently. Delete the release and re-cut the tag, or investigate why the tag moved."
              exit 65
            fi
            echo "::notice title=Release already exists — re-uploading this run's artifacts::$TAG was already published (a retry of a run that failed after publishing). Its assets are being replaced with the ones THIS run built and smoked, so the page and the checksums stay the same bytes the later jobs verify."
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$title" --notes-file "$notes"
          else
            # --verify-tag: refuse to invent a tag. If the tag is not already on
            # the remote, something is wrong upstream of here and the fix is not
            # for this step to create one.
            gh release create "$TAG" \
              --verify-tag \
              --title "$title" \
              --notes-file "$notes" \
              "${assets[@]}"
          fi

          echo "::notice title=Release published::$TAG is live with $EXPECTED_TARGETS tarballs and checksums.txt."

      # AC-2 / ADR-550-3 — the gate half. The step above CREATED provenance;
      # this one asks GitHub to VERIFY it, against the bytes a user would
      # download, with the same `gh attestation verify` invocation
      # docs/release-runbook.md hands to a human. A signing step nobody
      # verifies is a signing step that can silently stop working.
      #
      # WHAT A FAILURE HERE DOES, and why no new ordering edge was needed:
      # a non-zero exit fails the `release` job, and `bump-formula` already
      # declares `needs: [preflight, release]`. So the tap can never advance
      # past bytes whose provenance did not verify — the formula keeps pointing
      # at the previous release instead. That is the BR-4 invariant from
      # REQ-548 reached through the existing needs-graph, not a second
      # mechanism bolted beside it. Do not "optimise" this into a
      # `continue-on-error` step: a yellow warning nobody reads is how the
      # outcome this prevents happens anyway (LESSON-447).
      #
      # On a publish run the assets are downloaded FRESH from the release
      # rather than read out of `staging/`. Verifying the local copies would
      # prove provenance for bytes this job already had; the question worth
      # answering is whether what GitHub is now serving verifies. On a dry run
      # there is nothing published, so it checks this run's staged files — the
      # same bytes the attestation above covers — and says which it did.
      # Either way the gate RUNS; there is no mode in which it is skipped.
      #
      # EVERY published asset is fetched, checksums.txt included — not just the
      # tarballs. The batch verifier's first act is to re-derive each tarball's
      # sha256 and compare it against the line checksums.txt carries for it,
      # which is a check this step could not previously make at all: it
      # downloaded only the tarballs, so "the digests GitHub is serving in
      # checksums.txt describe the tarballs GitHub is serving" was asserted
      # nowhere in this pipeline.
      #
      # The loop that used to live here is gone. Its logic — count the inputs,
      # verify each one, tally failures separately from non-verdicts, report
      # every asset before exiting — is now
      # tools/release/verify-attestations-batch.sh, which the tooling job's
      # selftest can drive through every branch with stand-ins via TETON_GH. An
      # inline loop in a workflow is testable only by cutting a release, which
      # is the reason gates like this one rot unnoticed. Do not re-inline it.
      - name: Verify attestations (gate) (AC-2 / ADR-550-3)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PUBLISH: ${{ needs.preflight.outputs.publish }}
        run: |
          set -uo pipefail

          scratch=""
          if [ "$PUBLISH" = "true" ]; then
            # `|| scratch=""` rather than a bare assignment: the runner's shell
            # is `bash -e`, and an unguarded command substitution that fails
            # would abort this step with mktemp's own exit 1 — a red gate whose
            # status says "supply chain" when the truth is "no temp space".
            scratch="$(mktemp -d)" || scratch=""
            if [ -z "$scratch" ] || [ ! -d "$scratch" ]; then
              echo "::error title=Attestation gate UNCHECKED (AC-2)::'mktemp -d' could not create a scratch directory on this runner, so the published assets could not be downloaded. A temp-directory failure says nothing about the artifacts — this is UNCHECKED, not a rejection."
              exit 75
            fi
            if ! gh release download "$TAG" --dir "$scratch" \
                --pattern '*.tar.gz' --pattern 'checksums.txt'; then
              echo "::error title=Attestation gate UNCHECKED (AC-2)::'gh release download $TAG' failed, so the published assets could not be fetched and nothing was learned about their provenance. That is not a pass — failing rather than letting the tap bump follow an unverified release."
              # `|| true`: errexit is on, and a cleanup that failed would abort
              # this step with rm's status instead of the 75 the line above
              # just explained.
              rm -rf "$scratch" || true
              exit 75
            fi
            dir="$scratch"
            source_note="the assets GitHub is serving for $TAG"
          else
            # No release exists on a dry run, so the subjects are the files the
            # attestation step above actually attested — which now includes
            # checksums.txt, so the dry run exercises the digest cross-check
            # too rather than a reduced version of the gate.
            dir="staging"
            source_note="this run's staged tarballs and checksums.txt (nothing was published)"
          fi

          # The repository is spelled out rather than taken from
          # `github.repository` on purpose: this gate asserts that the bytes
          # carry provenance from THIS repository. Reading the name out of the
          # run's own context would make a fork verify against itself and pass
          # — the check would follow wherever it was copied to instead of
          # naming what it trusts. It is also, letter for letter, the command
          # in the runbook.
          #
          # The third argument names the workflow file that is allowed to have
          # signed these claims. Without it, an attestation minted by ANY
          # workflow in this repository satisfies the gate — including one a
          # pull request could add — so the assertion would be "someone with
          # write access built this" rather than "the release pipeline did".
          #
          # It is FULLY QUALIFIED — `<owner>/<repo>/<path>`, not the bare
          # `.github/workflows/release.yml`. gh compiles this value into a
          # regex matched against the certificate's SAN, and the SAN is the
          # whole `https://github.com/<owner>/<repo>/<path>@<ref>` URI. A bare
          # path is anchored against that URI and matches nothing, so EVERY
          # release lands 75 (UNCHECKED) with `Error: verifying with issuer
          # "sigstore.dev"` — a gate that can never pass, which is the failure
          # mode this argument exists to prevent. Verified empirically against
          # a live gh; do not "simplify" it back to the path.
          status=0
          bash tools/release/verify-attestations-batch.sh \
            "$dir" atelier-fashion/teton-code \
            atelier-fashion/teton-code/.github/workflows/release.yml \
            || status=$?

          # Removed here rather than in a trap: only a directory THIS step
          # created is removable, and `staging/` belongs to the job. Runs after
          # the verifier and before the exits below so every path is covered.
          #
          # `|| true` because errexit is on and $status is already captured: a
          # failing rm must not overwrite a verdict this step has already
          # reached. Losing a scratch directory on a runner that is about to be
          # destroyed is not worth a red gate, and it is certainly not worth a
          # red gate that reports the wrong reason.
          if [ -n "$scratch" ]; then
            rm -rf "$scratch" || true
          fi

          # 0/65/anything-else, and the `*` branch is the load-bearing one: a
          # missing batch script exits 127, a usage error exits 64, and both
          # must land on UNCHECKED rather than being rounded into either a pass
          # or a supply-chain alarm (LESSON-442).
          case "$status" in
            0)
              echo "::notice title=Attestation gate PASSED (AC-2)::All $EXPECTED_TARGETS tarballs and checksums.txt carry verifiable build provenance from atelier-fashion/teton-code's release workflow, and each tarball's sha256 matches the line checksums.txt carries for it. Checked: $source_note."
              ;;
            65)
              # Worded to exactly what a 65 proves and no further. It does NOT
              # establish that anyone tampered with anything, or which asset an
              # attacker touched; it establishes that one of two claims this
              # run is supposed to be able to make came back false. Naming the
              # two claims is what makes the annotation actionable — an alarm
              # that overstates gets argued with, and then ignored.
              echo "::error title=Attestation gate FAILED (AC-2)::At least one asset failed verification. What this proves: the bytes are NOT all covered by a build attestation from atelier-fashion/teton-code's own release workflow, and/or a tarball's sha256 does not match the digest checksums.txt lists for it. See the log for which assets and which check. Treat it as a supply-chain alarm until shown otherwise. The tap will NOT be bumped. Checked: $source_note."
              exit 65
              ;;
            *)
              echo "::error title=Attestation gate UNCHECKED (AC-2) (exit $status)::The verification could not reach a verdict — no gh, a missing or unreadable input, a malformed invocation, or an auth/rate-limit/network failure. Nothing was learned about these bytes. Deliberately not reported as a rejection, and deliberately not treated as a pass. The tap will NOT be bumped. Checked: $source_note."
              exit "$status"
              ;;
          esac

  # BR-4: the release is not finished when the Release page appears — it is
  # finished when the tap points at it, and points at something that installs
  # and runs. Nothing in this job carries `continue-on-error`, so a render,
  # audit, install or push failure paints the whole run red. A green release
  # beside a stale formula is the one outcome BR-4 exists to make impossible,
  # and a yellow warning nobody reads is how that outcome happens (LESSON-447).
  bump-formula:
    name: render · audit · install · push tap formula (BR-4)
    needs: [preflight, release]
    # macOS, not ubuntu, for one reason: `brew style` and `brew audit` ARE the
    # gate here. Running them where Homebrew is a preinstalled afterthought
    # invites the version of this job where the runner image quietly stops
    # shipping brew, the commands are not found, and a gate that never ran
    # looks exactly like a gate that passed (LESSON-443).
    runs-on: macos-15
    # REQ-550 BR-4: HOMEBREW_TAP_TOKEN resolves from the tap-publish
    # environment, whose rules admit exactly two shapes of ref — the `main`
    # BRANCH and `v*.*.*` TAGS. The repo-level copy of the token is retired per
    # docs/release-runbook.md's checklist, so this environment is the only place
    # it lives.
    #
    # Every `secrets.HOMEBREW_TAP_TOKEN` reference below is unchanged in text
    # and different in meaning: with this declaration the name resolves out of
    # the environment rather than the repository, so the tap's write credential
    # is reachable only from a run this environment admits.
    #
    # The `main` rule is what lets a dry run from `main` reach this job at all
    # instead of dying on an environment that refuses the ref — the same reason
    # release-signing carries it. It does NOT loosen BR-4: a dry run exits this
    # job before the token is read, and says so, and `needs.preflight.outputs.
    # publish` is what gates every step that could write the tap. Admitting the
    # ref and using the credential are two different things, and only the first
    # is what these rules decide.
    environment: tap-publish
    # The tap is one file in one repository, so writing it is a repo-wide
    # critical section — NOT a per-ref one like the workflow-level group above.
    # Without this, `v0.1.9` and `v0.2.0` pushed minutes apart run as two
    # independent workflows, both reach this job, and whichever finishes last
    # owns the formula regardless of which version is newer. Both runs go green
    # while every `brew upgrade` afterwards hands users whichever one lost the
    # race. Serialising is half the fix; the monotonic check below is the other
    # half, because a queue orders the writes without ordering the versions.
    #
    # `cancel-in-progress: false` for the same reason the workflow-level group
    # sets it: a tap push interrupted midway is worse than a queued one. Note
    # that GitHub keeps only ONE pending job per group, so a third concurrent
    # release cancels the second's tap job rather than queueing it — a cancelled
    # job is red, not green, so BR-4 still holds: no run claims to have bumped a
    # tap it did not bump.
    concurrency:
      group: tap-bump
      cancel-in-progress: false
    env:
      # `brew install` below runs against the tap clone this job made and has
      # NOT pushed yet. Homebrew's auto-update would `git fetch`/reset that
      # clone and could silently restore the previous formula underneath us —
      # installing the old version while this job believed it was testing the
      # new one. The version assertions after the install would catch it; not
      # letting it happen is better than catching it.
      HOMEBREW_NO_AUTO_UPDATE: 1
    steps:
      # SHA-pinned: this job holds HOMEBREW_TAP_TOKEN, a push credential for a
      # repository every `brew install` reads. See the carve-out note in the
      # `build` job above.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # This job holds the tap's write credential. Leaving the repository's
          # own token in .git/config for the whole job — through a `brew
          # install`, a formula's test block and a launchd service — hands it to
          # every one of them for no benefit: `gh` reads the environment, and
          # the tap is a separate clone.
          persist-credentials: false

      # A publish run hashes the bytes GitHub actually serves for the release
      # that was just published — byte-for-byte what `brew install` will fetch
      # from the URLs this formula is about to carry. Then it re-checks them
      # against the `checksums.txt` the release job computed and published: two
      # independent derivations of the same hashes, from two different fetches
      # of the same assets (BR-5). If they ever disagree, the artifacts changed
      # between publish and now, and no formula should be written.
      - name: Download the published release assets (publish runs)
        if: needs.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          gh release download "$TAG" \
            --dir artifacts \
            --pattern '*.tar.gz' \
            --pattern 'checksums.txt'

          cd artifacts
          ls -l

          work="${RUNNER_TEMP:-/tmp}"

          # `shasum -c` only checks the files checksums.txt names, so a
          # truncated or edited checksums.txt passes it while describing one
          # asset out of three. What it covers is therefore asserted before it
          # is trusted — the same assertion the release job makes when it writes
          # the file, made again here against what GitHub actually serves.
          find . -maxdepth 1 -type f -name '*.tar.gz' -exec basename {} ';' \
            | sort >"$work/downloaded.txt"
          awk '{ name = $2; sub(/^\*/, "", name); print name }' checksums.txt \
            | sort >"$work/claimed.txt"

          # The 3 is written out rather than read from EXPECTED_TARGETS, which
          # belongs to the `release` job's env and does not reach this one. A
          # FOURTH BUILD TARGET LANDS HERE TOO — alongside the release job's
          # EXPECTED_TARGETS, verify-attestations-batch.sh's EXPECTED_TARBALLS,
          # the URL count below, and package.sh's and smoke.sh's target
          # allowlists — or this gate keeps passing a release that is missing a
          # platform.
          downloaded="$(grep -c . "$work/downloaded.txt" || true)"
          if [ "${downloaded:-0}" -ne 3 ]; then
            echo "::error title=Release is missing assets (BR-5)::Release $TAG serves ${downloaded:-0} tarballs, expected 3 (one per target). The formula was NOT rendered."
            exit 65
          fi

          if ! diff -u "$work/downloaded.txt" "$work/claimed.txt"; then
            echo "::error title=Published checksums do not cover the published assets (BR-5)::checksums.txt on release $TAG does not name exactly the tarballs the release serves (diff above). 'shasum -c' would have passed while verifying only what it was told about. The formula was NOT rendered."
            exit 65
          fi

          set +e
          shasum -a 256 -c checksums.txt
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error title=Published assets do not match published checksums (BR-5)::The tarballs downloaded from release $TAG hash differently than the checksums.txt published beside them. The formula was NOT rendered — a sha256 that disagrees with itself must never reach a user's brew install."
            exit 65
          fi

      # A dry run has no release to download from, so it hashes this run's build
      # artifacts: the same bytes a publish run would have uploaded. It renders
      # and audits a real formula from real hashes — it just does not claim to
      # have verified anything about bytes GitHub is serving, because nothing
      # was served.
      #
      # SHA-pinned: `bump-formula` holds HOMEBREW_TAP_TOKEN, and this step
      # supplies the bytes the formula's sha256 fields are computed from. See
      # the carve-out note in the `build` job above.
      - name: Download this run's build artifacts (dry runs)
        if: needs.preflight.outputs.publish != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
          pattern: teton-*
          merge-multiple: true

      # One tap directory serves both modes: a publish run clones the real tap
      # into it and pushes from it, a dry run gets a scratch tap at the same
      # path. Homebrew resolves `atelier-fashion/tap/teton` from that location
      # either way, so the render and the audits below are literally the same
      # commands against the same formula reference in both modes. There is no
      # publish-only path for the gate to be missing from.
      - name: Prepare the tap working copy
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          PUBLISH: ${{ needs.preflight.outputs.publish }}
        run: |
          set -euo pipefail

          tap_dir="$(brew --repository)/Library/Taps/atelier-fashion/homebrew-tap"
          echo "TAP_DIR=$tap_dir" >>"$GITHUB_ENV"
          rm -rf "$tap_dir"
          mkdir -p "$(dirname "$tap_dir")"

          if [ "$PUBLISH" != "true" ]; then
            # A real repository with a commit and a remote, not a bare
            # directory. Homebrew asks git about a tap — its remote, its HEAD —
            # and a dry run that hands brew a different shape than a publish run
            # does is a dry run that can pass while the real thing fails.
            git init -q -b main "$tap_dir"
            mkdir -p "$tap_dir/Formula"
            git -C "$tap_dir" remote add origin https://github.com/atelier-fashion/homebrew-tap.git
            git -C "$tap_dir" \
              -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -q --allow-empty -m "scratch tap (dry run)"
            echo "::notice title=Tap clone SKIPPED (dry run)::Rendering into a scratch tap at $tap_dir. Nothing will be cloned, committed or pushed, and no tap token is read."
            exit 0
          fi

          if [ -z "${HOMEBREW_TAP_TOKEN:-}" ]; then
            echo "::error title=HOMEBREW_TAP_TOKEN is not set (BR-4)::The release is published but the formula cannot be pushed, so the tap still points at the previous version. Add the secret (see docs/homebrew-tap-setup.md) and re-run this job."
            exit 75
          fi

          # Cloned over plain HTTPS — the tap is public and reading it needs no
          # credential — and the clone is left with NO credential attached. The
          # token goes into .git/config for the length of the push and is
          # scrubbed immediately after (see the push step). A write-capable
          # token sitting in a config file for the rest of a job that runs `brew
          # install`, a formula's test block and a launchd service is a token
          # all three of those can read.
          #
          # Not shallow: the tap's history is the bump audit trail, and pushing
          # from a truncated one is a fight with the server nobody needs.
          git clone https://github.com/atelier-fashion/homebrew-tap.git "$tap_dir"
          mkdir -p "$tap_dir/Formula"

      # Serialising the tap writes (the `tap-bump` group above) orders them; it
      # does not order the VERSIONS. Two tags racing still means the loser can
      # land last and overwrite a newer formula with an older one, both runs
      # green, every `brew upgrade` after it a downgrade. So the tap is only
      # ever allowed to move forward, and a refusal is a named error rather than
      # a quiet skip — "nothing happened" and "nothing needed to happen" must
      # not look the same.
      #
      # The tap's current version is read out of the download URLs in the
      # formula it already carries, because that is where the version lives: the
      # formula deliberately has no `version` stanza (see the BR-3 step below).
      # This runs before the render, which overwrites that file.
      - name: Refuse a bump that would move the tap backwards (BR-4)
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -uo pipefail

          formula="$TAP_DIR/Formula/teton.rb"
          if [ ! -f "$formula" ]; then
            echo "::notice title=No formula in the tap yet::$formula does not exist, so there is no previous version this bump could move backwards from."
            exit 0
          fi

          # `-e` is on (the runner's default shell is `bash -e`) and a failing
          # command substitution takes the whole step with it, so every capture
          # here lands in a variable via `|| true` and is then checked. Letting
          # the shell die on a bare 1 would make the named errors below
          # unreachable — a taxonomy nothing can ever print (LESSON-442).
          current="$(grep -oE 'teton-v[0-9]+\.[0-9]+\.[0-9]+-' "$formula" | head -1 || true)"
          current="${current#teton-v}"
          current="${current%-}"

          if [ -z "$current" ]; then
            echo "::error title=Tap version UNREADABLE (BR-4)::A formula exists at $formula but no 'teton-vX.Y.Z-' download URL could be read out of it, so this run cannot tell whether pushing $VERSION would move the tap backwards. Nothing was learned, so nothing is pushed."
            exit 75
          fi

          if [ "$current" = "$VERSION" ]; then
            echo "::notice title=Tap already at this version::The tap carries $current, which is this release. Re-running a release over its own bump is a no-op, not a downgrade."
            exit 0
          fi

          # `sort -V` is version-aware on both runner images (BSD sort on
          # macos-15, GNU coreutils on ubuntu) — 0.9.0 sorts below 0.10.0, which
          # a lexical compare gets backwards. The oldest of the two is the head
          # of the ascending sort; if that is the version we are about to push,
          # the push is a downgrade.
          oldest="$(printf '%s\n%s\n' "$VERSION" "$current" | sort -V | head -1 || true)"
          # Fail CLOSED. An empty capture means the comparison did not happen
          # (no `sort -V` on this image, sort errored) — and an empty string is
          # never equal to $VERSION, so without this the guard would wave the
          # push through while printing "Tap moves forward: -> ". The one half
          # of the downgrade protection that could be disabled with nothing
          # going red.
          if [ -z "$oldest" ]; then
            echo "::error title=Version comparison UNCHECKED (BR-4)::Could not compare $VERSION against the tap's current $current — 'sort -V' produced nothing, so whether this push is a downgrade is unknown. Nothing was pushed."
            exit 75
          fi
          if [ "$oldest" = "$VERSION" ]; then
            echo "::error title=Refusing to downgrade the tap (BR-4)::The tap already points at teton $current and this run would replace it with the OLDER $VERSION. Nothing was pushed. This is what two releases racing looks like from the losing side: the later push wins regardless of which version is newer, and every 'brew upgrade' after it hands users a downgrade. If the newer tag's tap job is the one that failed, re-run that job."
            exit 65
          fi

          echo "::notice title=Tap moves forward::$current -> $VERSION."

      # Exit codes, per tools/release/render-formula.sh:
      #
      #   0   RENDERED
      #   64  red, ::error::. The inputs are wrong, or the template grew a
      #       placeholder the renderer cannot fill. Either way the formula would
      #       have carried a literal `{{...}}` or an empty string.
      #   *   red, ::error::. The render could not be attempted at all.
      - name: Render Formula/teton.rb from the template
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set +e
          bash tools/release/render-formula.sh \
            --version "$VERSION" \
            --artifacts artifacts \
            --output "$TAP_DIR/Formula/teton.rb"
          status=$?
          set -e

          case "$status" in
            0)
              echo "::notice title=Formula rendered::teton $VERSION, with all three sha256s computed here from the artifacts themselves (BR-5)."
              ;;
            64)
              echo "::error title=Formula render REFUSED::render-formula.sh rejected its inputs or found an unfilled placeholder — see the log for which. Nothing was written to the tap."
              ;;
            *)
              echo "::error title=Formula render UNCHECKED::render-formula.sh could not run (exit $status), so no formula exists to audit or push. Failing rather than leaving the tap on the previous version with a green release beside it (BR-4)."
              ;;
          esac
          exit "$status"

      # BR-3's third place. The formula carries no `version` stanza on purpose
      # — `brew audit` rejects one that agrees with the version it scans out of
      # the release URL — so the formula's version is Homebrew's own reading of
      # a URL this workflow rendered. That is a heuristic, and a heuristic that
      # is load-bearing gets checked: if some future Homebrew reads
      # `teton-v1.2.3-x86_64-apple-darwin.tar.gz` as anything but `1.2.3`, the
      # release stops here rather than publishing a tap entry whose version
      # disagrees with the tag.
      - name: Homebrew resolves the formula at the tag version (BR-3)
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -uo pipefail

          work="${RUNNER_TEMP:-/tmp}"

          # `brew info | jq` in one pipeline, under `-e -o pipefail`, cannot
          # report its own failure: brew exiting non-zero kills the step with a
          # bare 1 before any annotation runs, and "brew could not answer" then
          # looks nothing like the version mismatch this step exists to name.
          # So brew's status is captured and branched on separately, and jq
          # reads a file rather than a pipe.
          set +e
          brew info --json=v2 --formula atelier-fashion/tap/teton \
            >"$work/brew-info.json" 2>"$work/brew-info.err"
          brew_status=$?
          set -e

          if [ "$brew_status" -ne 0 ]; then
            cat "$work/brew-info.err" || true
            echo "::error title=Formula version UNCHECKED (BR-3)::'brew info --json=v2' exited $brew_status against the rendered formula, so Homebrew's reading of its version was never obtained. That is not evidence the version is right. The tap was NOT updated."
            exit 75
          fi

          resolved="$(jq -r '.formulae[0].versions.stable' <"$work/brew-info.json" || true)"
          if [ -z "$resolved" ] || [ "$resolved" = "null" ]; then
            echo "::error title=Formula version UNCHECKED (BR-3)::'brew info --json=v2' succeeded but carried no .formulae[0].versions.stable, so nothing was learned about the formula's version. The tap was NOT updated."
            exit 75
          fi

          if [ "$resolved" != "$VERSION" ]; then
            echo "::error title=Formula version does not equal the tag (BR-3)::Homebrew reads this formula as version '$resolved', but the release is '$VERSION'. The tap was NOT updated. Homebrew's URL version scan changed shape — the template needs an explicit version stanza again, and brew audit's redundancy check needs an exception."
            exit 65
          fi

          echo "::notice title=Formula version MATCH (BR-3)::Homebrew resolves atelier-fashion/tap/teton as $resolved, which is the tag."

      # Both run before either can fail the step: a formula can be wrong in
      # rubocop's eyes and in the auditor's for unrelated reasons, and learning
      # only the first of two problems costs a whole release cycle. Same reason
      # the build matrix sets `fail-fast: false`.
      #
      # Neither command needs `brew trust`, and that is not luck: Homebrew 6
      # treats a fully-qualified formula named on the command line as
      # self-authorizing, which is exactly how a user's
      # `brew install atelier-fashion/tap/teton` also clears the gate (BR-1).
      - name: brew style · brew audit the rendered formula
        run: |
          set +e
          brew style --formula atelier-fashion/tap/teton
          style=$?
          brew audit --formula atelier-fashion/tap/teton
          audit=$?
          set -e

          if [ "$style" -ne 0 ] || [ "$audit" -ne 0 ]; then
            echo "::error title=Rendered formula failed brew style/audit::brew style exited $style, brew audit exited $audit — see the log for the offences. The tap was NOT updated. Fix packaging/homebrew/teton.rb.tmpl; the tap copy is generated and editing it there would be undone by the next release."
            exit 65
          fi

          echo "::notice title=Formula passes brew style + brew audit::Rendered from the template and checked before anything was pushed."

      # The install below is on macOS arm64 and only proves the arm64 URL. The
      # other two are read straight back out of the rendered formula — not
      # reconstructed here, because a second place that knows the URL shape is a
      # second place to get it wrong — and fetched. A formula whose Linux URL
      # 404s is a release that looks green everywhere except on the machines it
      # broke (LESSON-433).
      - name: Every URL in the formula resolves (publish runs)
        if: needs.preflight.outputs.publish == 'true'
        run: |
          set -uo pipefail

          # `|| true` into a variable, then branch on emptiness: `-e` is on, and
          # `urls="$(grep ...)"` with no match exits the step at grep's bare 1,
          # before the "does not carry three URLs" error can print. The error
          # existed and was unreachable.
          urls="$(grep -oE 'https://[^"]+\.tar\.gz' "$TAP_DIR/Formula/teton.rb" || true)"
          # A fourth build target lands here too — see the note at the asset
          # count earlier in this job for the full list of places it must land.
          count="$(printf '%s\n' "$urls" | grep -c . || true)"
          if [ "${count:-0}" -ne 3 ]; then
            echo "::error title=Formula does not carry three download URLs::Found ${count:-0} tarball URLs in the rendered formula, expected one per target. The tap was NOT updated."
            exit 65
          fi

          # Read line by line. `for url in $urls` split on every space and tab
          # as well, so a URL that ever contained one would have been fetched as
          # two half-URLs, and both halves would have 404'd into a confusing
          # failure rather than an honest one.
          # Fetch and HASH, not just HEAD. A reachability probe proves the URL
          # serves something; it cannot prove the `sha256` written beside that
          # URL describes it. render-formula.sh builds the url_* and sha_*
          # variables in two independent passes keyed only by matching
          # identifier names, so a mispairing is a plain edit away — and only
          # the arm64 pair is ever proven downstream, because arm64 is the one
          # platform `brew install` runs on in this pipeline. The x86_64 legs
          # would have shipped a formula whose checksum fails on a user's
          # machine, with every gate here green.
          #
          # The sha is read from the formula line following its URL, which is
          # exactly the pairing Homebrew itself will act on — the check reads
          # the artifact the same way the consumer does.
          bad_pairs=0
          probe_dir="$(mktemp -d)"
          while IFS= read -r url; do
            [ -n "$url" ] || continue
            expected="$(grep -A1 -F "$url" "$TAP_DIR/Formula/teton.rb" \
              | sed -nE 's|^[[:space:]]*sha256[[:space:]]+"([0-9a-f]{64})".*|\1|p' | head -1)"
            if [ -z "$expected" ]; then
              echo "::error title=Formula URL carries no sha256::$url has no 64-hex sha256 on the line after it, so what brew would verify against is unknown. The tap was NOT updated."
              bad_pairs=$((bad_pairs + 1))
              continue
            fi
            if ! curl -fsSL --retry 3 --retry-delay 2 -o "$probe_dir/a.tar.gz" "$url"; then
              echo "::error title=Formula URL is not fetchable::$url returned no successful response. brew install would fail on whichever platform that URL serves. The tap was NOT updated."
              bad_pairs=$((bad_pairs + 1))
              continue
            fi
            actual="$(shasum -a 256 "$probe_dir/a.tar.gz" | awk '{ print $1 }')"
            if [ "$actual" = "$expected" ]; then
              echo "verified: $url"
            else
              echo "::error title=Formula sha256 does not describe its URL::$url hashes to $actual but the formula pairs it with $expected. brew install would refuse this artifact on whichever platform that URL serves. The tap was NOT updated."
              bad_pairs=$((bad_pairs + 1))
            fi
            rm -f "$probe_dir/a.tar.gz"
          done <<<"$urls"
          rm -rf "$probe_dir"

          [ "$bad_pairs" -eq 0 ] || exit 65

      # ---------------------------------------------------------------------
      # AC-5 and AC-6's mechanical evidence, gathered from a machine that
      # installs the formula and runs the binaries — and gathered BEFORE the
      # push, which is the whole point of it living here.
      #
      # It used to be a separate job that ran after the tap was pushed. A broken
      # `service do` block was therefore discovered at a moment when the release
      # AND the tap already pointed at it: exactly the state BR-4 exists to
      # prevent, reached by the job meant to prove it had not been. Nothing had
      # to move for this to run earlier — the release assets are live (the
      # release job published them) and the rendered formula is already in this
      # runner's tap clone.
      #
      # What these steps do NOT prove, and the `verify-install` job below does:
      # that `brew install atelier-fashion/tap/teton` works on a machine that
      # has never seen this tap. Homebrew resolves the name out of the clone
      # this job made, so the auto-tap fetch is not exercised here and BR-1's
      # one-command claim is not what these steps are evidence for.
      # ---------------------------------------------------------------------
      - name: brew install the formula about to be pushed (publish runs)
        if: needs.preflight.outputs.publish == 'true'
        run: |
          set -euo pipefail
          brew install --formula atelier-fashion/tap/teton
          echo "::notice title=Installed from the local tap clone::The formula this run rendered installs, and its arm64 tarball matched the sha256 the formula carries."

      # Everything after this point names the formula the short way — the way
      # AC-6 and the README spell it — which Homebrew 6 will not accept for an
      # untrusted tap. Trusting it here is a CI convenience that makes those
      # commands deterministic; it is NOT part of the install path proved above
      # or in verify-install.
      - name: Trust the tap for the short-name commands below (publish runs)
        if: needs.preflight.outputs.publish == 'true'
        run: |
          set -euo pipefail
          if brew trust --help >/dev/null 2>&1; then
            brew trust atelier-fashion/tap
            echo "::notice title=Tap trusted for short-name commands::This Homebrew has a 'brew trust' subcommand and it accepted the tap; the steps below use 'teton' rather than the fully-qualified name."
          else
            echo "::notice title=No 'brew trust' subcommand on this runner::'brew trust --help' did not succeed, so there is no trust subcommand to call here. Whether the short-name commands below require one was NOT established by this step — if they do, they will fail loudly at that point rather than being skipped."
          fi

      # AC-5: the formula's own test block, run by brew, against the installed
      # keg — both binaries must report the formula's version.
      - name: brew test teton (AC-5)
        if: needs.preflight.outputs.publish == 'true'
        run: |
          set -euo pipefail
          brew test teton
          echo "::notice title=brew test PASSED (AC-5)::The formula's test block ran against the installed binaries."

      - name: The installed teton reports the tag (BR-3)
        if: needs.preflight.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -uo pipefail

          # Captured with `|| true` and checked, not spliced straight into an
          # assignment: `-e` is on, so a `teton` that exits non-zero — the most
          # interesting failure this step could see — would have killed the step
          # before the MISMATCH annotation below could name it.
          installed="$(teton --version 2>&1 || true)"
          if [ -z "$installed" ]; then
            echo "::error title=Installed version UNCHECKED (BR-3)::'teton --version' produced no output on the installed keg, so nothing was learned about which version brew installed. The tap was NOT updated."
            exit 75
          fi

          case "$installed" in
            *"$VERSION"*)
              echo "::notice title=Installed version MATCH (BR-3)::teton --version reports '$installed' for tag v$VERSION."
              ;;
            *)
              echo "::error title=Installed version MISMATCH (BR-3)::brew installed the formula for $VERSION but 'teton --version' says '$installed'. The tag, the workspace version and the thing users get do not agree. The tap was NOT updated."
              exit 65
              ;;
          esac

      # REQ-565 AC-5: the DEFAULT lifecycle, proved before the opt-in one below.
      #
      # This is the claim the formula now makes to every user who runs plain
      # `brew install`: no service is registered, the CLI starts a daemon when
      # it needs one, and that daemon is GONE when the CLI exits. The old
      # `brew services` assertion (next step) proves the always-on opt-in and is
      # kept — but it proves the opposite lifetime, so it cannot stand in for
      # this one. A gate proves only what it exercises (LESSON-459).
      #
      # `teton doctor` is the round trip: it autostarts a daemon, handshakes it,
      # and exits. Under the shipped default that whole daemon should then be
      # gone. Asserting on the PROCESS, not on doctor's text, is deliberate —
      # the claim is "no teton-code process remains", and only pgrep can say so.
      - name: install → CLI round-trip → daemon is gone (REQ-565 AC-5)
        if: needs.preflight.outputs.publish == 'true'
        run: |
          set -uo pipefail

          DEADLINE_SECS=60

          daemon_pids() {
            pgrep -x teton-code || true
          }

          report_and_fail_565() {
            echo "::error title=$1"
            echo "--- teton doctor ---"
            teton doctor </dev/null 2>&1 || true
            echo "--- teton-code processes ---"
            # `pgrep -l`, not `ps | grep`: the pipeline form needs a
            # `[t]eton-code` trick to avoid matching itself, which shellcheck
            # rightly flags (SC2009). `pgrep` matches the process name directly,
            # so there is nothing to exclude. `-l` (pid + name) rather than `-a`
            # because BSD reads `-a` as "include ancestors", not as Linux's
            # "full command line" — and this job runs on macOS.
            pgrep -l teton-code || echo "(none)"
            echo "--- brew services list ---"
            brew services list || true
            echo "--- daemon logs ---"
            tail -n 50 "$(brew --prefix)/var/log/teton/"*.log 2>/dev/null || echo "(no logs)"
            exit 65
          }

          # Precondition: a plain `brew install` must not have registered or
          # started anything. If a daemon is already up here, the "no boot-time
          # start" half of AC-5 is false and the rest of this step would be
          # measuring the wrong process.
          if [ -n "$(daemon_pids)" ]; then
            report_and_fail_565 "A daemon was already running before any CLI ran (AC-5)::Plain 'brew install' must not start or register a service. The tap was NOT updated."
          fi

          # The round trip. It autostarts a daemon by design.
          teton doctor </dev/null >/dev/null 2>&1 || true

          # Wait for the daemon to go away on its own.
          #
          # A daemon legitimately outlives the CLI while it is downloading,
          # verifying, or loading model weights — BR-2 defers exit for exactly
          # that, and killing a 17 GB download because a terminal closed is the
          # behaviour the rule forbids. On this runner no model has been
          # consented to, so no install is in flight and the daemon has nothing
          # to defer for; the wait exists for CI slowness, not for that case.
          # If this ever starts timing out because a model IS being fetched, the
          # fix is to assert against a daemon with no install in flight — never
          # to widen the window until the assertion stops meaning anything.
          deadline=$(($(date +%s) + DEADLINE_SECS))
          while [ -n "$(daemon_pids)" ]; do
            if [ "$(date +%s)" -ge "$deadline" ]; then
              report_and_fail_565 "Daemon still running after the CLI exited (AC-5)::'teton doctor' completed but a teton-code process was still alive ${DEADLINE_SECS}s later. The shipped default is exit-on-last-client; a daemon that outlives every client is the standing-memory harm REQ-565 removes. The tap was NOT updated."
            fi
            sleep 1
          done

          echo "::notice title=On-demand lifecycle OK (REQ-565 AC-5)::Plain install started nothing; 'teton doctor' autostarted a daemon, handshook it, and the daemon exited with the CLI."

      # AC-6 and REQ-548 BR-6, end to end: launchd runs the daemon, the CLI handshakes
      # it without anyone invoking teton-code by hand, restart survives, stop
      # actually stops, and the logs are where brew says logs are.
      #
      # REQ-565 re-scopes what this proves. `brew services` is now the explicit
      # ALWAYS-ON opt-in, and the formula's service block passes
      # `--shutdown-policy never` so launchd's supervision and the daemon's
      # self-exit cannot fight. So this step now also stands as AC-8's evidence
      # that `never` + `brew services` keeps the pre-REQ-565 behaviour: the
      # daemon here must survive the CLI exits that the step above requires it
      # to NOT survive under the default.
      #
      # Every assertion is on doctor's TEXT, never its exit code. `teton doctor`
      # exits 0 whether or not it reaches a daemon — it is a diagnostic, not a
      # probe — so an exit-code assertion would pass against a service that
      # never started, which is precisely what this step exists to catch. Same
      # stance, same reason, as tools/release/smoke.sh.
      - name: services start · doctor · restart · stop (AC-6 / REQ-548 BR-6)
        if: needs.preflight.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -uo pipefail

          DEADLINE_SECS=60

          doctor_says_running() {
            teton doctor </dev/null 2>&1 | grep -F "daemon: running" || true
          }

          # Polls doctor rather than the socket file: bind() creates that file
          # before listen() accepts anything, so an existence check has a window
          # in which it is true and a connect still fails.
          wait_for_daemon() {
            local deadline line
            deadline=$(($(date +%s) + DEADLINE_SECS))
            while :; do
              line="$(doctor_says_running)"
              if [ -n "$line" ]; then
                printf '%s\n' "$line"
                return 0
              fi
              [ "$(date +%s)" -lt "$deadline" ] || return 1
              sleep 1
            done
          }

          wait_for_no_daemon() {
            local deadline
            deadline=$(($(date +%s) + DEADLINE_SECS))
            while :; do
              [ -n "$(doctor_says_running)" ] || return 0
              [ "$(date +%s)" -lt "$deadline" ] || return 1
              sleep 1
            done
          }

          report_and_fail() {
            echo "::error title=$1"
            echo "--- teton doctor ---"
            teton doctor </dev/null 2>&1 || true
            echo "--- brew services list ---"
            brew services list || true
            echo "--- daemon logs ---"
            tail -n 50 "$(brew --prefix)/var/log/teton/"*.log 2>/dev/null || echo "(no logs)"
            exit 65
          }

          brew services start teton \
            || report_and_fail "brew services start FAILED (AC-6)::launchd would not take the service defined by the formula, so the daemon never started. The tap was NOT updated."

          line="$(wait_for_daemon)" \
            || report_and_fail "Daemon never answered after start (AC-6)::brew services start exited 0 but teton doctor never reported a running daemon within ${DEADLINE_SECS}s — without anyone invoking teton-code by hand, which is the whole claim. The tap was NOT updated."

          case "$line" in
            *"$VERSION"*)
              echo "::notice title=Daemon handshake OK (AC-6)::$line"
              ;;
            *)
              report_and_fail "Daemon is running the wrong version (AC-6 / BR-3)::doctor reported '$line', which does not name $VERSION. The tap was NOT updated."
              ;;
          esac

          # REQ-565 AC-8 / BR-5: the always-on opt-in must actually stay on.
          # The service block passes `--shutdown-policy never`, so this daemon
          # must survive the very CLI exit that ends a default-lifetime daemon.
          # If `never` were ever dropped or misspelled, the daemon would exit
          # here, launchd would restart it, and the pair would flap — reloading
          # the model every cycle. That failure is silent without this check:
          # `doctor` a moment later would find a *replacement* daemon and look
          # healthy.
          before_pid="$(pgrep -x teton-code | head -1)"
          teton doctor </dev/null >/dev/null 2>&1 || true
          sleep 5
          after_pid="$(pgrep -x teton-code | head -1)"
          if [ -z "$after_pid" ]; then
            report_and_fail "Service daemon exited with the CLI (REQ-565 AC-8/BR-5)::The brew-services daemon must run under --shutdown-policy never and survive a CLI exit, but no teton-code process remains. The tap was NOT updated."
          fi
          if [ "$before_pid" != "$after_pid" ]; then
            report_and_fail "Service daemon was replaced, not preserved (REQ-565 AC-8/BR-5)::teton-code was pid $before_pid before the CLI round trip and $after_pid after, so it exited and launchd restarted it — the keep-alive/self-exit flap the 'never' policy exists to prevent. The tap was NOT updated."
          fi
          echo "::notice title=Always-on opt-in OK (REQ-565 AC-8)::The brew-services daemon (pid $after_pid) survived a CLI round trip, as --shutdown-policy never requires."

          # REQ-548 BR-6: "where are the logs" must have a brew answer. launchd creates
          # both redirect targets when it spawns the service, so if the daemon
          # is up and these are not here, the formula's log paths are wrong.
          #
          # The names are READ FROM THE FORMULA, never restated here. v0.1.1's
          # first attempt failed on exactly that duplication: the daemon binary
          # was renamed to teton-code and the template's log_path followed, but
          # this assertion still looked for tetond.log — a rename that swept
          # every file it obviously touched and missed the one that restated
          # the same fact somewhere else. Asking the formula what it promised,
          # then checking that promise held, is a check that cannot drift.
          # The whole path is captured, not just the basename: the directory is
          # the formula's fact too, and hardcoding `var/log/teton` here would
          # have left half the duplication this derivation exists to remove.
          formula_file="$TAP_DIR/Formula/teton.rb"
          log_rel="$(sed -nE 's|^[[:space:]]*log_path[[:space:]]+var/"([^"]+)".*|\1|p' "$formula_file" | head -1)"
          err_rel="$(sed -nE 's|^[[:space:]]*error_log_path[[:space:]]+var/"([^"]+)".*|\1|p' "$formula_file" | head -1)"
          log_name="$(basename "${log_rel:-}")"
          err_name="$(basename "${err_rel:-}")"
          log_dir="$(brew --prefix)/var/$(dirname "${log_rel:-x/y}")"
          if [ -z "$log_rel" ] || [ -z "$err_rel" ]; then
            report_and_fail "Could not read the formula's log paths (REQ-548 BR-6)::Neither log_path nor error_log_path parsed out of $formula_file, so whether the daemon writes where the formula promises is UNKNOWN. The tap was NOT updated."
          fi
          if [ -f "$log_dir/$log_name" ] && [ -f "$log_dir/$err_name" ]; then
            echo "::notice title=Daemon logs are under brew var (REQ-548 BR-6)::$log_dir ($log_name, $err_name — as declared by the formula)"
            ls -l "$log_dir"
          else
            report_and_fail "Daemon logs are not where the formula says (REQ-548 BR-6)::The formula declares $log_name and $err_name under $log_dir, and launchd did not create them there. The tap was NOT updated."
          fi

          brew services restart teton \
            || report_and_fail "brew services restart FAILED (AC-6)::the service would not come back. The tap was NOT updated."
          wait_for_daemon >/dev/null \
            || report_and_fail "Daemon never answered after restart (AC-6)::restart exited 0 but no daemon responded within ${DEADLINE_SECS}s. The tap was NOT updated."
          echo "::notice title=Restart OK (AC-6)::The daemon came back after brew services restart."

          brew services stop teton \
            || report_and_fail "brew services stop FAILED (AC-6)::brew could not stop the service. The tap was NOT updated."

          # An exit-0 `stop` that leaves the daemon serving would satisfy a
          # naive check and violate the rule, so stop is asserted the same way
          # start is: by asking the daemon.
          wait_for_no_daemon \
            || report_and_fail "Daemon still answering after stop (AC-6)::brew services stop exited 0 but teton doctor still reports a running daemon after ${DEADLINE_SECS}s. The tap was NOT updated."

          echo "::notice title=Stop OK (AC-6)::The daemon stopped answering after brew services stop."
          brew services list

      - name: Commit and push the bump (publish runs)
        if: needs.preflight.outputs.publish == 'true'
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          # A token the server rejects otherwise turns into an interactive
          # credential prompt on a runner with no terminal, which is a job that
          # hangs until it is cancelled rather than a job that fails.
          GIT_TERMINAL_PROMPT: 0
        run: |
          set -uo pipefail

          clean_url="https://github.com/atelier-fashion/homebrew-tap.git"

          # The credential is attached to the push remote for the length of the
          # push and no longer. The trap makes the scrub unconditional: a push
          # that dies partway must not leave a write-capable token in a file
          # that outlives this step.
          scrub_push_url() {
            git -C "$TAP_DIR" remote set-url --push origin "$clean_url" >/dev/null 2>&1 || true
          }
          trap scrub_push_url EXIT

          git -C "$TAP_DIR" add Formula/teton.rb

          # Re-running a release over an already-correct tap is a no-op, not a
          # failure: the invariant BR-4 protects is "the tap points at this
          # release", and it already does.
          if git -C "$TAP_DIR" diff --cached --quiet; then
            echo "::notice title=Formula already current::The tap's Formula/teton.rb already matches what this run rendered for $VERSION. Nothing to commit."
            exit 0
          fi

          git -C "$TAP_DIR" \
            -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "teton $VERSION"

          git -C "$TAP_DIR" remote set-url --push origin \
            "https://x-access-token:$HOMEBREW_TAP_TOKEN@github.com/atelier-fashion/homebrew-tap.git"

          # No --force, ever. The tap's history is the bump audit trail, and a
          # force-push is how a wrong formula stops being reconstructable.
          push_status=0
          git -C "$TAP_DIR" push || push_status=$?

          scrub_push_url

          # Asserted, not assumed: the credential is gone from the only file it
          # was ever written to. This is checked before the push result is
          # reported, so a failed push cannot skip past it.
          if grep -Fq 'x-access-token' "$TAP_DIR/.git/config"; then
            echo "::error title=Tap token still present in .git/config::The push URL was not scrubbed, so a write-capable credential is readable for the remainder of this job. Failing the release rather than continuing with it in place."
            exit 65
          fi

          if [ "$push_status" -ne 0 ]; then
            echo "::error title=Tap push FAILED (BR-4)::Release $VERSION is published but the tap still points at the previous version, so brew installs the old release. Check that HOMEBREW_TAP_TOKEN still has contents:write on atelier-fashion/homebrew-tap (docs/homebrew-tap-setup.md), then re-run this job."
            exit 65
          fi

          echo "::notice title=Tap formula bumped::atelier-fashion/homebrew-tap now points at teton $VERSION."

      - name: What a publish run would have done (dry runs)
        if: needs.preflight.outputs.publish != 'true'
        run: |
          echo "::notice title=Tap push SKIPPED::This run rendered the formula below from its own build artifacts and it passed brew style, brew audit and the BR-3 version check — but nothing was cloned, committed or pushed, and the install/services steps are skipped because there is no published release to install from."
          cat "$TAP_DIR/Formula/teton.rb"

  # BR-1, stated the way a user states it: one command, no tap step, no `brew
  # trust`, no toolchain — on a machine that has never seen this tap. That is
  # the one assertion which cannot move earlier: it requires the formula to be
  # PUSHED, because the thing being proved is that Homebrew can find and fetch
  # it. (Homebrew 6 requires third-party taps to be trusted but treats a
  # fully-qualified name on the command line as self-authorizing, which is why
  # this is still one command.)
  #
  # Everything functional about the formula — its version, its test block, its
  # launchd service, its logs — was already proved before the push, in
  # bump-formula. This job is deliberately narrow: it is evidence about the
  # published tap's reachability, not a second functional gate.
  #
  # It covers macOS arm64 only, because that is the runner GitHub offers. The
  # x86_64 legs stay covered at the strength the release notes claim for them
  # (Rosetta smoke in `build`, URL reachability in `bump-formula`) and no
  # further — a green run here is not evidence about Intel or Linux (LESSON-433).
  verify-install:
    name: brew install from the published tap (BR-1 / AC-5)
    needs: [preflight, bump-formula]
    # Nothing was published, so there is nothing to install. bump-formula's dry
    # -run step says so out loud, so this grey box has its reason printed
    # beside it rather than merely being absent.
    if: needs.preflight.outputs.publish == 'true'
    runs-on: macos-15
    permissions:
      # `contents: read` fetches the release asset; `attestations: read` is
      # what lets `gh attestation verify` query this repository's provenance
      # records. Spelled out rather than inherited so the attestation step at
      # the bottom of this job cannot quietly lose the permission it needs and
      # start reporting UNCHECKED forever.
      contents: read
      attestations: read
    steps:
      - name: brew install atelier-fashion/tap/teton (BR-1)
        run: |
          set -euo pipefail
          brew install atelier-fashion/tap/teton
          echo "::notice title=Installed from the live tap::One command on a runner that had never seen this tap — no trust step, no Rust toolchain, no cmake."

      # Named the long way on purpose: this job proves the untrusted-tap path,
      # so it must not trust the tap first. bump-formula covers the short-name
      # commands.
      - name: brew test the published formula (AC-5)
        run: |
          set -euo pipefail
          brew test atelier-fashion/tap/teton
          echo "::notice title=brew test PASSED (AC-5)::The pushed formula's test block ran against binaries installed from the published tap."

      - name: The installed teton reports the tag (BR-3)
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -uo pipefail

          installed="$(teton --version 2>&1 || true)"
          if [ -z "$installed" ]; then
            echo "::error title=Installed version UNCHECKED (BR-3)::'teton --version' produced no output after installing from the published tap, so nothing was learned about what users now get."
            exit 75
          fi

          case "$installed" in
            *"$VERSION"*)
              echo "::notice title=Installed version MATCH (BR-3)::teton --version reports '$installed' for tag v$VERSION, installed from the published tap."
              ;;
            *)
              echo "::error title=Installed version MISMATCH (BR-3)::The published tap installs something that reports '$installed', not $VERSION."
              exit 65
              ;;
          esac

      # Checked out HERE, after every install assertion above, and not at the
      # top of the job: this job's claim is that a machine which has never seen
      # this tap can install with one command, and a repository checkout
      # sitting on the runner before `brew install` runs is a difference from
      # the user's machine that would have to be argued about. Nothing above
      # needs the repository; the step below needs one script from it.
      # SHA-pinned: this job runs the provenance gate a user would run, and
      # carries `attestations: read` to do it. A moved tag here could change
      # the script the gate executes. See the carve-out note in `build`.
      - name: Checkout (for the verification script only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # AC-2, from the user's end of the pipe. The release job already gated on
      # provenance; this runs the runbook's own command against an asset
      # fetched here, on a different machine, after the tap bump — so the
      # instruction docs/release-runbook.md gives a human is proven to work
      # every release rather than being documented and hoped for.
      #
      # This is arm64 evidence and nothing more. LESSON-433: a verified
      # aarch64 tarball says nothing about the x86_64 or Linux ones, which the
      # release job's gate covers and this job deliberately does not restate.
      - name: The published tarball for this runner carries provenance (AC-2)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -uo pipefail

          # Derived from the runner rather than hardcoded: this job exists to
          # be evidence about the machine it actually ran on, and a fixed
          # target string would keep claiming arm64 on the day GitHub changes
          # what `macos-15` is.
          case "$(uname -m)" in
            arm64 | aarch64) target="aarch64-apple-darwin" ;;
            x86_64) target="x86_64-apple-darwin" ;;
            *)
              echo "::error title=Provenance UNCHECKED (AC-2)::This runner reports architecture '$(uname -m)', which does not map to any target this release publishes, so there is no tarball to verify. Nothing was learned."
              exit 75
              ;;
          esac

          asset="teton-v$VERSION-$target.tar.gz"

          # Guarded exactly like the release job's gate: this step runs under
          # `set -uo pipefail` with the runner's default `bash -e`, so an
          # unguarded command substitution that failed would abort the step
          # with mktemp's own exit 1 — a red "Provenance" step whose status
          # says supply chain when the truth is "no temp space on the runner".
          scratch="$(mktemp -d)" || scratch=""
          if [ -z "$scratch" ] || [ ! -d "$scratch" ]; then
            echo "::error title=Provenance UNCHECKED (AC-2)::'mktemp -d' could not create a scratch directory on this runner, so the published tarball could not be downloaded. A temp-directory failure says nothing about the artifact — this is UNCHECKED, not a rejection."
            exit 75
          fi

          if ! gh release download "$TAG" --dir "$scratch" --pattern "$asset" \
              --repo atelier-fashion/teton-code; then
            echo "::error title=Provenance UNCHECKED (AC-2)::'gh release download $TAG --pattern $asset' failed, so the published tarball for this runner could not be fetched and its provenance is unknown."
            exit 75
          fi

          # verify-attestation.sh directly, not the batch wrapper: this job
          # verifies ONE asset — the tarball for the architecture it is running
          # on — and the batch script's contract is a directory holding the
          # complete release. Passing it a directory of one would be asking it
          # to fail a completeness check this job is deliberately not making.
          #
          # The third argument pins WHICH workflow may have signed the claim,
          # matching the release job's gate. It matters more here than there:
          # this step is the one whose command docs/release-runbook.md prints
          # for a human to run, so an argument the gate uses and the runbook
          # omits would be a documented command weaker than the one CI runs.
          #
          # Fully qualified — `<owner>/<repo>/<path>` — for the reason spelled
          # out at the release job's gate: gh matches this against the whole
          # `https://github.com/<owner>/<repo>/<path>@<ref>` SAN, and a bare
          # path never matches, so it would turn this gate into a permanent 75.
          status=0
          bash tools/release/verify-attestation.sh "$scratch/$asset" \
            atelier-fashion/teton-code \
            atelier-fashion/teton-code/.github/workflows/release.yml \
            || status=$?

          case "$status" in
            0)
              echo "::notice title=Provenance verified end to end (AC-2)::'gh attestation verify $asset --repo atelier-fashion/teton-code' — the runbook's own command — passed against the published asset, on a machine that also installed this release from the live tap."
              ;;
            65)
              echo "::error title=Provenance FAILED (AC-2)::gh verified and REJECTED $asset. The release job's gate passed on these bytes and this one did not, which means the published asset changed after that gate ran. Do not tell anyone to install this release."
              ;;
            *)
              echo "::error title=Provenance UNCHECKED (AC-2)::verify-attestation.sh could not reach a verdict for $asset (exit $status) — no gh, missing file, or an auth/rate-limit/network failure. Not a rejection, and not a pass."
              ;;
          esac
          exit "$status"

  # BR-8: tetoncode.ai must advertise this release, and it will not do so on its
  # own.
  #
  # deploy-site.yml triggers on `release: published`, and that event never
  # arrives: GitHub does not raise workflow-triggering events for actions taken
  # with the repository's GITHUB_TOKEN, and `gh release create` above is one of
  # them. The site workflow is therefore not "wired up and occasionally flaky" —
  # it can never fire from a release this pipeline publishes. The event trigger
  # stays in deploy-site.yml for releases cut by a human or a PAT; this job is
  # the path that actually runs for a tag push.
  #
  # `workflow_dispatch` is the documented exception to that rule — along with
  # `repository_dispatch` it is the one event GITHUB_TOKEN may raise — which is
  # why this dispatches rather than, say, re-creating the release.
  #
  # DO NOT "simplify" this away by relying on the release event. It looks
  # redundant with deploy-site.yml's own trigger and it is not.
  #
  # Placed last on purpose: the site may only advertise a version that is
  # published, whose tap actually carries it, and which installs from that tap.
  # A page announcing a version whose tap bump failed sends every reader to a
  # `brew install` that hands them the previous release.
  dispatch-site-deploy:
    name: publish tetoncode.ai (BR-8)
    needs: [preflight, release, bump-formula, verify-install]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # `gh workflow run` is an Actions API write. Scoped to this job; no other
      # job in this workflow may start a workflow.
      actions: write
    steps:
      - name: Dispatch deploy-site.yml at the release tag
        env:
          # No checkout in this job, so `gh` has no git remote to infer the
          # repository from; GH_REPO tells it directly.
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -uo pipefail

          dispatch_status=0
          # -f tag: the dispatched run must render THE version whose tap bump
          # this run just proved. --ref alone selects which workflow FILE to
          # run, not which version it renders; without the input deploy-site
          # falls back to `releases/latest`, which under two racing releases is
          # a different version than the tap now carries — the page would
          # advertise X beside a `brew install` that hands visitors Y.
          gh workflow run deploy-site.yml --ref "$TAG" -f tag="$TAG" || dispatch_status=$?

          if [ "$dispatch_status" -ne 0 ]; then
            echo "::error title=Site deploy was NOT requested (BR-8)::'gh workflow run deploy-site.yml --ref $TAG' exited $dispatch_status, so tetoncode.ai was never asked to republish and still advertises the previous version. The release and the tap are correct; only the site is stale. Re-run this job, or dispatch Deploy site manually with tag=$TAG."
            exit 65
          fi

          # Stated at exactly the strength it holds: this job proves the deploy
          # was REQUESTED and accepted. Whether tetoncode.ai actually
          # republished is that run's own red-or-green, not this one's — a green
          # box here is not evidence the site is live (LESSON-443).
          echo "::notice title=Site deploy requested (BR-8)::Deploy site was dispatched against $TAG. Its own run reports whether tetoncode.ai republished: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/deploy-site.yml"
