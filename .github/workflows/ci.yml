name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# One in-flight run per *commit*, not per ref: pushing commit n+1 no longer
# cancels commit n's run, so every tip that starts a run keeps a complete result.
# What cancellation always killed was `fmt · clippy · test (macos-latest)`, the
# slowest of the seven job runs — and macOS is the runner that caught
# LESSON-591's detached-naming race, which passed 40/40 locally and on
# ubuntu-latest. REQ-599 lost that leg on two of its seven commits exactly this
# way; REQ-600 kept it only by waiting out each run before pushing the next.
#
# cancel-in-progress stays true and still earns its keep: with the SHA in the
# group it collapses duplicate runs of the SAME commit on the SAME ref — a
# re-run, or a close/reopen — which is the only kind of superseding GitHub can
# actually recognise here.
#
# The trade (REQ-605 ADR-2): a force-push that abandons a commit no longer kills
# its run, so that run finishes on a tree nobody will merge. `concurrency` keys
# on a string and has no notion of ancestry, so it cannot tell "n+1 builds on n"
# from "Y replaces X" — one behaviour or the other, not both. The waste is
# bounded to that one run, and it is small: cancellation only ever landed inside
# `Tests`, after the toolchain install, the cache restore and a full clippy
# compile had already been paid for. Killing it there returned about ten seconds
# of macOS time, destroyed the whole macOS result, and skipped `Post Cache cargo
# build` so the next run started colder.
concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

# Declared here rather than inherited from the repo-wide default: the default is
# a mutable org/repo setting, and this workflow executes repo-authored shell
# (tools/release/selftest.sh) on every PR. Jobs widen locally if they ever need to.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        # rustup reads rust-toolchain.toml and installs the pinned channel.
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add rustfmt clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace

  gated:
    name: feature-gated targets compile (all features)
    # Every other job compiles the workspace with DEFAULT features, so a target
    # gated behind a non-default feature (`llama`, `presence`, `live`,
    # `test-seam`) is a file CI can see but never compiles — and a file that
    # exists while nothing asserts it still builds is LESSON-510's shape
    # exactly (existence checked, freshness not). BUG-167 is what that looks
    # like in practice: the REQ-554 AC-6 weights smoke
    # (crates/tetond/tests/template_smoke.rs) sat broken on main through a
    # constructor change, CI green the whole time.
    #
    # Compiling is cheap where running is not: the gated tests need real
    # weights or live keys to RUN, but only cmake to BUILD (llama.cpp compiles
    # from source; the runner image ships cmake). Weights and keys stay out of
    # CI; every `#[ignore]` stays ignored — this job runs no tests at all.
    #
    # macos-latest deliberately: `presence` is cfg-gated to
    # `target_os = "macos"`, so an ubuntu leg with --all-features would still
    # strip the LocalAuthentication FFI and claim more than it checked — the
    # same trap this job exists to close. The macOS runner is the one place
    # every gated cfg branch actually expands.
    #
    # Clippy rather than bare `cargo check`, warnings denied, so gated code
    # meets the same bar the always-on clippy leg holds the rest of the tree
    # to — a target that only compiles "on its own terms" would drift the
    # moment it was next touched.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup component add clippy

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Clippy over every target with every feature (warnings denied)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  catalog:
    name: catalog integrity (BR-8/AC-8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Verifies that the *catalog* is honest: every entry's `sha256` and
      # `size_bytes` are compared against HuggingFace's `lfs.oid`/`lfs.size` at
      # the pinned revision, the revision is an immutable 40-hex commit SHA, and
      # the repo answers an anonymous, ungated request (REQ-547 architecture
      # D-1). That is metadata only — no artifact is downloaded, so the whole
      # catalog verifies in a couple of seconds and can gate every run.
      #
      # The artifact's own bytes are still hashed against these digests at
      # download time by the downloader (BR-6). The two checks answer different
      # questions; neither replaces the other.
      #
      # Exit codes are a taxonomy, not a boolean, because an upstream outage
      # must never be mistakable for corruption — nor pass unnoticed:
      #
      #   0   VERIFIED    green.
      #   1   MISMATCH    red, ::error::. A genuine integrity failure. Do not
      #                   merge; a digest disagrees with the artifact, a repo
      #                   went gated, or the file was hand-edited.
      #   75  UNVERIFIED  red, ::warning::. HuggingFace was unreachable after
      #                   retries. Nothing was learned about the catalog either
      #                   way — this is NOT corruption. Re-run the job once
      #                   upstream recovers. It fails rather than passes so an
      #                   outage cannot quietly waive the gate.
      - name: Catalog integrity (HuggingFace LFS metadata, no downloads)
        run: |
          set +e
          python3 tools/refresh-catalog.py --check
          status=$?
          set -e
          case "$status" in
            0)
              echo "::notice title=Catalog integrity::VERIFIED — every entry matches HuggingFace's LFS metadata at its pinned revision."
              ;;
            75)
              echo "::warning title=Catalog integrity UNVERIFIED::HuggingFace was unreachable, so the catalog could NOT be verified. This is NOT a digest mismatch and NOT evidence of corruption. Re-run this job when upstream is reachable."
              ;;
            *)
              echo "::error title=Catalog integrity MISMATCH::The catalog disagrees with HuggingFace at a pinned revision. This is a genuine integrity failure, not a network problem — see the log for the offending entry and field."
              ;;
          esac
          exit "$status"

  e2e:
    name: acceptance suite (REQ-544 + REQ-547)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      # The end-to-end acceptance suite (TASK-014) spawns the real `tetond`
      # binary and drives every AC against mock transports/engines — no model
      # weights and no live API keys. It gates every PR, covering REQ-544's
      # `ac_matrix` and REQ-547's `consent_matrix` (AC-1..AC-12). The
      # `--features live` real-provider smoke test stays ignored here by design.
      - name: Acceptance suite
        run: cargo test -p tetond --test e2e

  audit:
    name: dependency advisories (cargo audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Rust toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install

      - name: Cache cargo build
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      # The daemon now ships a production HTTP client that fetches multi-GB
      # third-party artifacts, so a dependency-advisory gate belongs beside the
      # catalog-integrity job. The RustSec advisory DB fetch is split from the
      # check so the two failure modes cannot be confused — the same taxonomy the
      # catalog job uses:
      #
      #   * a transient DB-fetch outage teaches nothing about our dependencies,
      #     so it warns and passes rather than reding the build on GitHub's
      #     availability;
      #   * a real advisory in the resolved tree fails the job.
      - name: Fetch advisory database
        id: advisory_db
        continue-on-error: true
        run: git clone --depth 1 https://github.com/RustSec/advisory-db "$HOME/.cargo/advisory-db"

      - name: Audit dependencies for security advisories
        run: |
          if [ ! -d "$HOME/.cargo/advisory-db/.git" ]; then
            echo "::warning title=cargo audit UNVERIFIED::The RustSec advisory database could not be fetched, so dependencies were NOT audited this run. This is a transient outage, not a vulnerability — re-run when GitHub is reachable."
            exit 0
          fi
          cargo audit --no-fetch --db "$HOME/.cargo/advisory-db"

  tooling:
    name: release tooling (actionlint · shellcheck · selftest)
    runs-on: ubuntu-latest
    # No cargo, no network beyond the pinned actionlint download, no secrets —
    # the whole job is well under a minute, so the release pipeline gets the
    # same every-PR gate the daemon has had since REQ-547. Before this job the
    # release and site workflows and every script under tools/release/ were
    # only ever exercised by cutting a tag, i.e. after they could still be
    # wrong (REQ-548 verify: "no standing CI checks for any of the new
    # tooling").
    env:
      # Pinned, and checksum-verified against the pin: a new upstream release
      # must not red an unrelated PR, and a pinned URL without a digest is not
      # actually a pin. Bump both lines together — the digest comes from
      # actionlint's own `actionlint_<version>_checksums.txt` release asset.
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A download failure fails the job rather than warning past it. Unlike the
      # advisory database above — where an outage teaches nothing about our
      # dependencies but the tree is still auditable later — an absent linter
      # means this gate did not run at all, and a gate that waives itself on a
      # transient error is not a gate (LESSON-447).
      - name: Install actionlint (pinned, checksum-verified)
        run: |
          set -uo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"

          # `--retry-all-errors` matters as much as the count: the observed
          # failure here was `curl: (35) Recv failure: Connection reset by peer`
          # — a mid-transfer reset, which plain `--retry` does NOT retry
          # (it covers transient HTTP codes and, with --retry-connrefused,
          # refused connections). Without it a single reset reads exactly like
          # a broken script.
          fetch_status=0
          curl -fsSL --retry 5 --retry-delay 2 --retry-connrefused --retry-all-errors -O \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}" \
            || fetch_status=$?
          if [ "$fetch_status" -ne 0 ]; then
            # LESSON-442: a transport failure is NOT a lint failure. This job
            # gates the release tooling; announcing "could not fetch the linter"
            # as though the tooling were broken sends the next person to debug
            # the wrong thing. 75 = could not run, nothing was learned.
            echo "::error title=Release tooling UNCHECKED (transport)::curl exited $fetch_status fetching actionlint ${ACTIONLINT_VERSION} after 5 attempts, so the workflows and release scripts were never linted. This says nothing about them — re-run the job."
            exit 75
          fi
          set -e
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" actionlint
          sudo install -m 0755 actionlint /usr/local/bin/actionlint
          rm -f actionlint "$tarball"
          actionlint --version

      # actionlint shells out to shellcheck for every `run:` block, and if
      # shellcheck is absent it checks none of them and still exits 0. That is
      # exactly the silent-degradation shape this repo refuses, so shellcheck's
      # presence is asserted here rather than assumed from the runner image, and
      # its version is printed so a runner-image bump that introduces a new
      # check is diagnosable from the log.
      - name: Lint the workflows (actionlint, shellcheck-backed)
        run: |
          set -euo pipefail
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "::error title=shellcheck missing::shellcheck is not on this runner, so actionlint would have skipped every 'run:' block while still exiting 0. The lint gate did NOT run. Install shellcheck in this job before trusting it."
            exit 75
          fi
          shellcheck --version
          actionlint -color -shellcheck shellcheck .github/workflows/*.yml

      # The release and site pipelines are mostly shell, and it is shell that
      # runs against a published release with no undo. `failglob` makes a
      # vanished directory a named error instead of shellcheck being handed a
      # literal '*' pattern.
      - name: Lint the release + site shell scripts (shellcheck)
        run: |
          set -euo pipefail
          shopt -s failglob
          shellcheck tools/release/*.sh site/render.sh

      # The self-test is the release tooling's own test suite (network-free,
      # cargo-free): it drives every script under tools/release/ through its
      # positive AND negative paths, including smoke.sh, so the exit-code
      # taxonomy the workflows branch on is verified rather than assumed.
      #
      # This path is a contract. `release.yml`, `deploy-site.yml` and
      # docs/release-runbook.md all treat "the selftest is green" as the
      # standing evidence for the release scripts; do not rename it and do not
      # inline its logic here.
      #
      # Same taxonomy as the catalog job above — "it failed" and "it could not
      # run" must never be confused (LESSON-442, ADR-548-4). Any non-zero code
      # fails the job; the codes only change what the log says happened.
      #
      # These are selftest.sh's own codes (its header is the authority); they
      # are NOT tools/release/'s 64/65 taxonomy. The suite is a test runner, so
      # it uses a runner's convention: 1 means "a case failed".
      #
      #   0   passed.
      #   1   red, ::error::. A script under test behaved wrongly. A real bug.
      #   75  red, ::warning::. The harness could not run. Nothing was learned,
      #                         which is not a pass.
      - name: Release tooling self-test (tools/release/selftest.sh)
        run: |
          set -euo pipefail

          # Asserted, never skipped. If the harness is deleted the gate must go
          # red and say so — a check that quietly disappears along with its
          # script is worse than no check, because the badge keeps claiming it.
          if [ ! -f tools/release/selftest.sh ]; then
            echo "::error title=Release tooling self-test MISSING::tools/release/selftest.sh does not exist, so nothing under tools/release/ was exercised this run. This job asserts the harness rather than skipping past it."
            exit 75
          fi

          set +e
          bash tools/release/selftest.sh
          status=$?
          set -e
          case "$status" in
            0)
              echo "::notice title=Release tooling self-test::PASSED — every script under tools/release/ behaved as specified on both its success and its failure paths."
              ;;
            1)
              echo "::error title=Release tooling self-test FAILED::A script under tools/release/ behaved wrongly. This is a real defect in the release pipeline — see the failing case in the log. Do not cut a tag until it is green."
              ;;
            75)
              echo "::warning title=Release tooling self-test UNVERIFIED::tools/release/selftest.sh could not run (75), so the release scripts were NOT exercised this run. This is NOT a passing result — it is the absence of one."
              ;;
            *)
              echo "::error title=Release tooling self-test exited $status::selftest.sh returned a code it does not document (its header defines 0, 1 and 75). Treated as a failure, because an unrecognised code is not a pass."
              ;;
          esac
          exit "$status"

  parity:
    name: required checks mirror ci.yml (REQ-608)
    runs-on: ubuntu-latest
    # Branch protection is configuration the forge holds, not a file in this
    # tree, so the set of *required* contexts drifts from the set of *defined*
    # jobs silently — and in both directions. A required context nothing
    # defines blocks every merge; a defined job nothing requires blocks none.
    # The second is how BUG-167 lived here: `feature-gated targets compile (all
    # features)` ran on every PR, reported red, and could not stop a single
    # merge. LESSON-464 names that shape — a control that exists and that
    # nothing fails when it is removed, weakened, or repositioned. This job is
    # the thing that fails.
    #
    # Its own job rather than a step in `tooling` (ADR-608-1), for two reasons.
    # A job's `name:` IS its required-check context, and `tooling`'s name
    # enumerates its contents (`actionlint · shellcheck · selftest`) — bolting
    # parity onto it would either make that name a lie or force a rename, and a
    # rename is a coordinated protection edit, exactly the class of change this
    # job exists to make visible. The other reason is diagnosis: a repo-wide
    # red on "release tooling" caused by an admin editing branch protection is
    # a ten-minute mystery, where a red on "required checks mirror ci.yml" says
    # what happened. It also guards itself — un-require this context and the
    # check reports its own name under `missing` on every PR. It cannot block
    # at that point, but it is loud where the original defect was silent.
    #
    # Nothing widens to run it, and that is deliberate (AC-9): the before/after
    # effective-permission diff for this change is *none*, for every job in
    # this workflow, this one included. No job here declares a job-level
    # permissions block — grep this file and the sole hit is the workflow-level
    # one above, which every job inherits as `contents: read`. The
    # read path is the PUBLIC branch endpoint
    # (`GET /repos/{owner}/{repo}/branches/main`), which answers anonymously on
    # this repository — measured, not assumed; `/branches/main/protection` is
    # the one that 401s, and it is not used. `GITHUB_TOKEN` is passed only to
    # lift the anonymous 60/hour rate limit shared by every GitHub-hosted
    # runner behind the same egress IP, so no `administration: read` and no PAT
    # is required (ADR-608-2). Handing that token to a step that runs
    # repo-authored Python on a fork's PR adds no exposure this workflow does
    # not already carry: `actions/checkout` persists the same token into
    # `.git/config` in every job here by default, and a fork PR's token is
    # read-only on a public repository regardless.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # PyYAML because BR-3 wants a real parse: a hand-rolled subset reader for
      # `jobs:` and `strategy.matrix` is the "works now, fails silently later"
      # shape that rule exists to avoid. The pin has ONE home — the script
      # prints it (`--pyyaml-pin`) and this step installs what it prints — so
      # the requirement and the remedy the script names cannot drift apart.
      # Guarded: a runner image that already ships a PyYAML is used as-is (the
      # pin governs what is INSTALLED, not what is accepted — `safe_load` of
      # this file is stable across every 5.x/6.x release and the version is
      # printed so a drift is diagnosable from the log). Deliberately NOT
      # `continue-on-error`: a gate that waives itself on a transient fetch
      # failure is not a gate (LESSON-447, the same rule as the pinned
      # actionlint download). Version-pinned, not hash-pinned, unlike that
      # download: PyPI forbids re-uploading a released version, so the residual
      # is registry compromise, accepted for a parse-only dependency. The
      # `--break-system-packages` retry is for PEP 668 images whose system
      # Python refuses `--user` installs; this is a throwaway runner.
      - name: Install PyYAML (pinned)
        run: |
          set -euo pipefail
          pin="$(python3 tools/ci/required-checks-parity.py --pyyaml-pin)"
          if python3 -c 'import yaml' 2>/dev/null; then
            echo "PyYAML present on the runner image"
          else
            python3 -m pip install --user "$pin" \
              || python3 -m pip install --user --break-system-packages "$pin"
          fi
          python3 -c 'import yaml; print("PyYAML", yaml.__version__)'

      # The check's own known-bads (ADR-608-6) run on every PR rather than
      # being trusted from the commit that added them. Every mutation in that
      # table is a case here — a job added to a fixture copy of this file, a
      # context deleted from the required set, one added, a 401, a dropped
      # connection, an unprotected branch, a ruleset present, a two-dimension
      # matrix — and each asserts on the RENDERED output rather than on the
      # source containing a string (LESSON-519). They open no socket: the
      # script takes its fetcher as an argument, so the fakes never leave the
      # process.
      #
      # The `Ran N tests` grep is not decoration. `unittest` exits 0 on a suite
      # that collected nothing, so a rename, a moved file, or a discovery
      # failure under a different runner all produce a green step that verified
      # nothing — the vacuous-run shape this repo refuses. The bare `OK` line
      # is required too: `OK (skipped=N)` is also exit 0, and a suite that
      # skipped everything ran nothing. Output is captured to a file rather
      # than piped through `tee`: under `pipefail` a pipeline's status is the
      # last command's, and `tee` always succeeds, so the failure would be
      # swallowed by the very line meant to record it.
      #
      # A vacuous run is `::error::`, not the `::warning::` the script's own 75
      # gets below: an outage teaches nothing about the tree, but a test suite
      # that ran nothing is a defect IN the tree, and it is red for that reason.
      - name: Unit tests (known-bads run every PR)
        run: |
          set -euo pipefail
          log="$(mktemp)"
          status=0
          python3 -m unittest tools/ci/test_required_checks_parity.py -v > "$log" 2>&1 || status=$?
          cat "$log"

          if [ "$status" -ne 0 ]; then
            echo "::error title=Parity known-bads FAILED::The parity check's own test suite exited $status, so the comparison below cannot be trusted whatever it says. Fix the suite first — see the failing case in the log above."
            exit "$status"
          fi

          if ! grep -Eq '^Ran [1-9][0-9]* tests? in ' "$log" || ! grep -Eqx 'OK' "$log"; then
            echo "::error title=Parity known-bads VACUOUS::The unit run exited 0 without reporting 'Ran N tests' for any N >= 1 and a bare 'OK' (not 'OK (skipped=N)'), so no case actually executed. A suite that ran nothing is not a pass — check that tools/ci/test_required_checks_parity.py is still discoverable from the repository root."
            exit 75
          fi

      # Derives one context per job by parsing this file (ADR-608-4: the job's
      # `name:`, one context per leg of a single-dimension matrix, and any
      # other shape named and failed rather than guessed), reads main's
      # required set from the forge, and fails on either difference. The two
      # directions are different defects and both are reported: `missing` is a
      # job that reports on every PR and can block none (BUG-167's shape);
      # `stale` is a required context nothing reports, which parks every PR at
      # "Expected — waiting for status to be reported". The DRIFT annotation
      # below paraphrases the script's REMEDIES block; the two are kept in step
      # by hand.
      #
      # Same taxonomy as the `catalog` and `tooling` jobs above — "they
      # disagree" and "I could not look" must never share a code (ADR-608-3,
      # LESSON-442):
      #
      #   0   PARITY     green.
      #   1   DRIFT      red, ::error::. A real disagreement. The job output
      #                  above names every missing and stale context and states
      #                  both remedies; read it rather than guessing which edit
      #                  is the intended one.
      #   75  UNCHECKED  red, ::warning::. The workflow could not be parsed, a
      #                  job was underivable, the forge could not be read, or
      #                  the tool crashed. Nothing was learned about branch
      #                  protection either way — this is NOT a pass and NOT
      #                  drift. Re-run once the read works.
      #
      # Any other code fails as well: an undocumented code is not a pass.
      - name: Required checks mirror ci.yml (both directions)
        env:
          # Rate limit only, per the job header — the endpoint is public and
          # answers without it. No scope is requested and none is required.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          python3 tools/ci/required-checks-parity.py --repo "$GITHUB_REPOSITORY" --branch main
          status=$?
          set -e
          case "$status" in
            0)
              echo "::notice title=Required checks::PARITY — main's required status checks are exactly the jobs this workflow defines, in both directions."
              ;;
            1)
              echo "::error title=Required checks DRIFT::main's required status checks and the jobs ci.yml defines disagree. The job output above lists every 'missing' context (defined here, not required — it reports on each PR and can block none) and every 'stale' one (required, not defined — every PR waits forever on a status nothing reports), and it names both remedies: revert the protection edit, or update .github/workflows/ci.yml. Pick the one that matches intent."
              ;;
            75)
              echo "::warning title=Required checks UNCHECKED::The parity check could not reach a verdict, so NOTHING was learned about branch protection. This is NOT a pass and it is NOT evidence of drift — see the log for the cause (unparseable workflow, underivable job, unreadable forge, or a crash) and re-run once the read works."
              ;;
            *)
              echo "::error title=Required checks exited $status::required-checks-parity.py returned a code it does not document (its header defines 0, 1 and 75). Treated as a failure, because an unrecognised code is not a pass."
              ;;
          esac
          exit "$status"
